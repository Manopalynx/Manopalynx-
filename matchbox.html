const eraseBtn = actionChip('Erase', ()=>setTool('erase'), false, 'erase');
actsEl.appendChild(eraseBtn);

/* Clear asks first, and asking is where you say what you meant.

   It used to arm on one tap and wipe on the next, inside a three-second window. That
   was safe enough — but it spent two taps saying one thing, and both taps landed on
   the same chip, which is the shape a mis-tap has. Room had the better answer already:
   a chip that borrows the drawer row and shows what it could do. So Clear borrows it
   too. The first tap opens the choice, the second lands on a different chip with a
   different word on it, and the confirmation comes free with the question.

   The wipe is not the only thing you want gone, either. A box full of creatures you
   are done with, or a fire you have watched long enough, both used to mean losing the
   build with them. Back is in the row because the other three all destroy something,
   and a drawer you cannot leave without breaking something is a trap. */

// The fire's own leavings, as against the gases you can place: derived from the tray
// rather than named, so a flame product added later is covered by having a row and not
// being in a drawer. Measured to be exactly Fire, Smoke and Steam — asserted in the
// suite, because the day that stops being true this rule quietly changes meaning.
const TRAYED = new Set(GROUPS.flatMap(g => Array.isArray(g.items) ? g.items : []));
const FUMES  = new Set();
for (let t=0;t<M.length;t++) if (t!==E && M[t] && M[t].ph===0 && !TRAYED.has(t)) FUMES.add(t);

// Where a cell would sit if you had just placed it. Fire is a change to the heat field
// as much as it is a flame, so putting it out means putting the heat field back, and
// `t0` is where every material starts. Lava arrives at 1180°C and stays there: lava is
// a heat source, not a fire, and Fire is not a way of turning it off.
const restingAt = t => (M[t] && M[t].t0 !== undefined) ? M[t].t0 : AMBIENT;

function livingCells(){
  let n = 0;
  for (let i=0;i<type.length;i++) if (type[i]!==E && M[type[i]].alive) n++;
  return n;
}
function anythingBurning(){
  for (let i=0;i<type.length;i++)
    if (FUMES.has(type[i]) || temp[i] > restingAt(type[i]) + .5 || life[i] > 0) return true;
  return false;
}

const clearEl = document.createElement('div');
function clearChoice(label, act, danger, fn){
  clearEl.appendChild(actionChip(label, ()=>{ fn(); showDrawer(TOOLS_DRAWER); }, danger, act));
}

// Back first, so the way out is where the thumb already is and the chip that cannot be
// undone is at the far end of the row from it.
clearChoice('Back', 'clear-none', false, ()=> say('Nothing removed', true));

clearChoice('Fire', 'clear-fire', false, ()=>{
  if (!anythingBurning()){ say('Nothing alight, and nothing warm', true); return; }
  snapshot('putting the fire out');
  let flames = 0;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i = idx(x,y);
    if (FUMES.has(type[i])){ become(x,y,E); flames++; }
    const rest = restingAt(type[i]);
    if (temp[i] > rest) temp[i] = rest;
    // `life` is how far a cell has charred, so a log that was most of the way to
    // catching goes back to being a log. Worth about two ticks and no more: measured
    // against a wall of wood with lava at its foot, the relight came back at 71-74
    // ticks with this line and 69-71 without it. What actually stops a fire coming
    // straight back is the cooling above — char decays on its own once a cell is under
    // its ignition point. This is here because `put()` clears the same field, and
    // "back to how it was placed" is the whole rule.
    life[i] = 0;
  }
  say(`Fire out — ${flames} flame${flames===1?'':'s'} gone, and the heat with it`);
});

clearChoice('Life', 'clear-life', false, ()=>{
  const n = livingCells();
  if (!n){ say('Nothing living in the box', true); return; }
  snapshot('clearing the life');
  for (let y=0;y<H;y++) for (let x=0;x<W;x++)
    if (type[idx(x,y)]!==E && M[type[idx(x,y)]].alive) become(x,y,E);
  say(`Cleared ${n} living thing${n===1?'':'s'}`);
});

clearChoice('Everything', 'clear-all', true, ()=>{
  snapshot('the clear');
  wipeAll();
  say('Cleared');
});

const clearBtn = actionChip('Clear', ()=>{
  fillFrom(clearEl);
  tabsEl.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed','false'));
  say('Clear — pick what goes. Fire takes the heat', true);
}, false, 'clear');
actsEl.appendChild(clearBtn);
actsEl.appendChild(actionChip('Rain', ()=>{ snapshot('the rain'); raining = RAIN_TICKS; }, false, 'rain'));

/* A false-colour view of the temperature field. The model is the whole point of this
   box and almost none of it is visible: a log at 280°C and a log at 20°C look the
   same until one of them catches. This shows the plume, the conduction along a steel
   bar, and the cold shadow under a block of ice. */
/* The room, as six named settings rather than a slider.

   Named because the number on its own does not tell you anything — 170°C is a fact,
   "straw and paper catch on their own" is the reason to turn it there. The readout
   carries both, and it is the readout doing that work rather than the button, because
   the button has to stay the same size as every other chip in the tray.

   Turning the room only moves the air. Everything solid comes along by conduction, at
   whatever rate its own `cond` and `cap` say — which is the point, and is why a block of
   ice can hold out in an oven for a while. Without the nudge to the air the change took
   seconds to be visible at all, because the air only relaxes toward the room at
   ROOM_LOSS a tick and everything else waits on the air. */
const ROOMS = [
  { n:'Freezing', t:-30, tell:'water freezes' },
  // 0 freezes water too, and says so. Water sits exactly at the room and rounds under
  // its own freezing point, so labelling this one "ice keeps" and leaving it there
  // would have been the same kind of false promise the setting below it started as.
  { n:'Cold',     t:  0, tell:'ice keeps, and water becomes it' },
  // 'Normal' rather than 'Room', only because the gauge line reads "room Room 20°C"
  // otherwise, and a stutter in the one place the setting is displayed is worth a word.
  { n:'Normal',   t: 20, tell:'nothing happens on its own' },
  { n:'Warm',     t: 90, tell:'wax runs, water is nearly boiling' },
  { n:'Oven',     t:230, tell:'powder, straw, oil, fuse and paper catch on their own' },
  { n:'Furnace',  t:480, tell:'everything but coal and thermite goes by itself' },
];
let roomAt = 2;                                  // Normal, 20°C

/* Tapping Room shows the six, rather than stepping to the next one.

   Cycling was the first version and it was reported as clunky, correctly: the settings
   are invisible until you have been through them, and getting from Furnace back to
   Normal is five taps in one direction and none in the other. Six chips is one row,
   which is the size of every other drawer, so showing them costs nothing and moves
   nothing — the row it borrows is the row the tray already keeps clear. */
const roomEl = document.createElement('div');

function setRoom(i){
  roomAt = i;
  const r = ROOMS[i];
  AMBIENT = r.t;
  // The room is the air. Everything solid comes along by conduction at whatever its own
  // `cond` and `cap` say, which is the interesting part and is why ice can hold out in
  // an oven for a while.
  for (let k=0;k<type.length;k++) if (type[k]===E) temp[k] = AMBIENT;
  roomEl.querySelectorAll('.chip').forEach((c,k) => c.setAttribute('aria-pressed', String(k===i)));
  matsEl.querySelectorAll('.chip[data-room]').forEach((c,k) => c.setAttribute('aria-pressed', String(k===i)));
  say(`${r.n} — ${r.t}°C, ${r.tell}`, true);
}

ROOMS.forEach((r,i) => {
  const b = actionChip(r.n, ()=>{ setRoom(i); showDrawer(TOOLS_DRAWER); }, false, 'room-' + r.n.toLowerCase());
  b.dataset.room = i;
  b.setAttribute('aria-pressed', String(i === roomAt));
  roomEl.appendChild(b);
});

const roomBtn = actionChip('Room', ()=>{
  fillFrom(roomEl);
  tabsEl.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed','false'));
  say(`Room — ${ROOMS[roomAt].n}, ${AMBIENT}°C. Pick one`, true);
}, false, 'room');
actsEl.appendChild(roomBtn);

const heatBtn = actionChip('Heat', ()=>{
  heatView = !heatView;
  heatBtn.setAttribute('aria-pressed', String(heatView));
}, false, 'heat');
actsEl.appendChild(heatBtn);

const findBtn = actionChip('Finds', ()=>openFindPicker(), false, 'finds');
actsEl.appendChild(findBtn);

/* ============================================================ scenes

   Presets and saves both drop a whole box in at once, so they share the plumbing.

   Built in cells, not in fractions of the screen. A wick is one cell wide and a
   candle is twenty tall wherever you open this, because the simulation is in cells and
   a scene scaled to the screen would behave differently on every phone — a wick two
   cells wide is a different candle, not the same candle bigger. Everything is centred
   and clipped instead, so a narrow box shows less of a wide scene rather than a
   squashed one. */

function wipeAll(){
  type.fill(E); temp.fill(AMBIENT); fuel.fill(0); life.fill(0); vel.fill(0); feed.fill(0);
  way.fill(0); breath.fill(0);
  raining = 0;
}
function sSlab(x0,y0,x1,y1,t){
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (inb(x,y)) put(x,y,t);
}

// Every scene stands on the same floor, six deep, so the bottom of the box is the
// bottom of the box and a preset never leaves a pour with nowhere to go.
function sceneFloor(){ const f = H-6; sSlab(0, f, W-1, H-1, STONE); return f; }

/* Six of them, and every one is a scenario the suite already measures — which is the
   point of choosing these six rather than six pretty ones. A preset that cannot be
   made to work is the worst thing in the box: it looks like a promise. If one of these
   ever stops paying off, a check goes red in `test/matchbox-sim.mjs` first.

   None of them is lit. The match is the whole interaction and a scene that arrives
   already burning has spent it. */
const SCENES = [
  { name:'Candle', tell:'Candle — light the wick',
    build(){
      const f = sceneFloor(), cx = W>>1;
      sSlab(cx-4, f-20, cx+3, f-1, WAX);
      for (let y=f-26; y<=f-19; y++) if (inb(cx,y)) put(cx, y, FUSE);
    } },

  { name:'Fuse', tell:'Fuse — light the far end and stand back',
    build(){
      const f = sceneFloor(), cx = W>>1;
      const x1 = Math.min(W-18, cx+30);
      sSlab(x1, f-8, x1+14, f-1, POWDER);
      for (let x=Math.max(2, x1-46); x<x1; x++) put(x, f-1, FUSE);
    } },

  { name:'Cut', tell:'Cut — light the magnesium, not the thermite',
    build(){
      const f = sceneFloor(), cx = W>>1;
      const pt = f-14;                       // plate hangs with air under it, so a
      sSlab(cx-20, pt, cx+19, pt+2, STEEL);  // cut has somewhere to fall
      sSlab(cx-6, pt-6, cx+5, pt-1, THERMITE);
      sSlab(cx-4, pt-8, cx+3, pt-7, MAGNES);
    } },

  { name:'Lava', tell:'Lava — sand makes glass, water makes obsidian',
    build(){
      const f = sceneFloor(), cx = W>>1;
      sSlab(cx-22, f-15, cx-22, f-1, STONE);
      sSlab(cx+21, f-15, cx+21, f-1, STONE);
      sSlab(cx-21, f-12, cx+20, f-1, LAVA);
    } },

  { name:'Acid', tell:'Acid — glass holds it, nothing else does for long',
    build(){
      const f = sceneFloor(), cx = W>>1;
      sSlab(cx-20, f-17, cx-20, f-1, GLASS);
      sSlab(cx+19, f-17, cx+19, f-1, GLASS);
      sSlab(cx-20, f-1, cx+19, f-1, GLASS);
      sSlab(cx-19, f-14, cx+18, f-2, ACID);
      sSlab(cx-12, f-10, cx-6, f-4, STEEL);
      sSlab(cx+3, f-10, cx+9, f-4, WOOD);
    } },

  // This used to say "and it does not wait", which was true and was the wrong thing to
  // do about it: the room emptied itself in about ten seconds because a painted gas was
  // fading on the same clock as smoke. Now it keeps — measured, 396 cells at nought
  // seconds and 396 at sixty — so the label can say what the scene is for instead of
  // apologising for it.
  { name:'Gas', tell:'Gas — let it gather under the lid, then reach in with a match',
    build(){
      const f = sceneFloor(), cx = W>>1;
      const lid = Math.max(2, f-26);
      sSlab(cx-20, lid, cx+19, lid, STONE);
      sSlab(cx-20, lid, cx-20, f-1, STONE);
      sSlab(cx+19, lid, cx+19, f-1, STONE);
      sSlab(cx-18, f-12, cx+17, f-2, GAS);
    } },
];

function loadScene(s){
  snapshot(`loading ${s.name}`);
  wipeAll();
  s.build();
  drawn = true;
  hintEl.style.opacity = 0;
  say(s.tell, true);
}

/* ------------------------------------------------------------ saving

   What a save is, and what it deliberately is not: it stores **what you built, not
   what the fire was doing**. Every cell comes back through `put()`, at its own
   starting temperature with its fuel full, exactly as though you had just drawn it.

   That is a choice and it costs something — a scene saved halfway through burning
   comes back unburnt. It buys three things worth more. A save is a few kilobytes
   instead of most of a megabyte, because the material layout run-length encodes to
   almost nothing while a temperature field mid-fire has a different number in every
   cell and encodes to nothing at all. It is the same scene every time it is loaded,
   rather than a physics state that may or may not still catch. And it cannot come back
   subtly wrong, which a rounded temperature field can: four degrees of quantisation on
   the wrong side of an ignition point is a scene that used to light and now does not.

   If resuming a fire mid-burn turns out to matter, that is a second format and not a
   change to this one. */

const STORE_KEY = 'matchbox.scene.1';
let storeOK = null;

// Asked once, and asked by trying rather than by feature-detecting: `localStorage`
// exists and throws on access in a private window, and on file:// in some browsers.
function storageWorks(){
  if (storeOK !== null) return storeOK;
  try {
    localStorage.setItem('matchbox.probe','1');
    localStorage.removeItem('matchbox.probe');
    storeOK = true;
  } catch { storeOK = false; }
  return storeOK;
}

function encodeScene(){
  const keys = [], seen = new Map();
  const idxOf = t => {
    const k = SAVE_KEY[t] !== undefined ? SAVE_KEY[t] : 'air';
    if (!seen.has(k)){ seen.set(k, keys.length); keys.push(k); }
    return seen.get(k);
  };
  const rle = read => {
    const runs = [];
    let prev = idxOf(read(0)), n = 1;
    for (let i=1;i<type.length;i++){
      const k = idxOf(read(i));
      if (k === prev){ n++; continue; }
      runs.push(n, prev); prev = k; n = 1;
    }
    runs.push(n, prev);
    return runs;
  };
  const runs = rle(i => type[i]);
  // v2 adds `feed`, which is what each vent pours. It is a second run-length pass over
  // the same palette rather than a field on the first, because it is zero in all but a
  // handful of cells and so costs almost nothing encoded on its own. Without it a saved
  // volcano comes back as a vent that pours nothing, which looks exactly like a vent
  // that is broken.
  const vents = rle(i => feed[i]);
  // v3 adds the room, by name rather than by index for the same reason the materials are
  // — the list can grow. Leaving it out was a defect and not a simplification: a volcano
  // built in a Furnace and loaded back at Normal is not the scene that was saved, it is a
  // different one doing different things, and nothing about it looks wrong.
  return { v:3, w:W, h:H, keys, runs, feed: vents, room: ROOMS[roomAt].n };
}

// Returns the keys it could not place, which is not an error: a save written by a
// later build can name a material this one has never heard of, and losing those cells
// while keeping the rest is better than refusing the whole scene. Saying so out loud
// is the part that matters — silently dropping them is how a save becomes a scene you
// did not draw.
function decodeScene(s){
  const missing = [];
  const map = s.keys.map(k => {
    if (TYPE_OF_KEY.has(k)) return TYPE_OF_KEY.get(k);
    missing.push(k); return E;
  });
  const expand = runs => {
    const out = new Uint8Array(s.w * s.h);
    let p = 0;
    for (let r=0; r+1<runs.length; r+=2){
      const n = runs[r], t = map[runs[r+1]];
      for (let q=0; q<n && p<out.length; q++) out[p++] = t === undefined ? E : t;
    }
    return out;
  };
  const src = expand(s.runs);
  // A v1 save has no vents in it, because vents did not exist when it was written.
  const srcFeed = Array.isArray(s.feed) ? expand(s.feed) : new Uint8Array(s.w * s.h);
  // The room goes first, because wipeAll fills the field with the current AMBIENT and
  // put() hands a material with no `t0` the current AMBIENT too. Setting it afterwards
  // leaves the floor at the old room's temperature under the new room — measured in the
  // suite as a stone floor at −30°C freezing the water standing on it in a 20°C room,
  // which reads exactly like the box freezing water at room temperature.
  // A save from before v3 has no room in it and keeps whatever is set, which is the only
  // answer available and is why this says so rather than guessing at 20.
  const named = ROOMS.findIndex(r => r.n === s.room);
  if (named >= 0) setRoom(named);
  wipeAll();
  // Bottom-aligned and clipped, the same rule a resize already uses, because the
  // floor is the floor. A scene saved on a taller screen loses its ceiling rather
  // than its ground.
  const drop = H - s.h, cols = Math.min(W, s.w);
  for (let y=0; y<H; y++){
    const oy = y - drop;
    if (oy < 0 || oy >= s.h) continue;
    for (let x=0; x<cols; x++) put(x, y, src[oy*s.w + x]);
  }
  return missing;
}

// Save is the last chip that arms. Three seconds is long enough to read the question
// and short enough that a chip left saying "Replace?" is not still armed when you come
// back to it.
const ASK_WINDOW = 3000;
let saveArmed = 0, saveTimer = 0;
function disarmSave(){
  saveArmed = 0;
  clearTimeout(saveTimer);
  chipLabel(saveBtn, 'Save');
  saveBtn.setAttribute('aria-pressed','false');
}

const saveBtn = actionChip('Save', ()=>{
  if (!storageWorks()){ say('This browser will not store anything', true); return; }
  // Only the overwrite asks. Saving into an empty slot cannot lose anything, and a
  // confirm on a harmless action is what teaches people to tap through the one that
  // is not.
  if (localStorage.getItem(STORE_KEY) && Date.now() >= saveArmed){
    saveArmed = Date.now() + ASK_WINDOW;
    chipLabel(saveBtn, 'Replace?');
    saveBtn.setAttribute('aria-pressed','true');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(disarmSave, ASK_WINDOW);
    say('Replace the saved scene?', true);
    return;
  }
  const text = JSON.stringify(encodeScene());
  let ok = true;
  try { localStorage.setItem(STORE_KEY, text); } catch { ok = false; }
  // A write that threw nothing has still not necessarily happened. This exact failure
  // — a full quota reported as a clean save — is one the ledger in this repository
  // shipped with, and it is invisible until the day you try to load.
  if (ok && localStorage.getItem(STORE_KEY) !== text) ok = false;
  disarmSave();
  say(ok ? `Saved  ·  ${(text.length/1024).toFixed(1)}kB` : 'The save did not stick — storage is full or blocked', true);
}, true, 'save');

const loadBtn = actionChip('Load', ()=>{
  if (!storageWorks()){ say('This browser will not store anything', true); return; }
  const text = localStorage.getItem(STORE_KEY);
  if (!text){ say('Nothing saved yet', true); return; }
  let s = null;
  try { s = JSON.parse(text); } catch { s = null; }
  if (!s || !(s.v >= 1 && s.v <= 3) || !Array.isArray(s.keys) || !Array.isArray(s.runs) ||
      !(s.w > 0) || !(s.h > 0)){
    say('That save is damaged', true); return;
  }
  snapshot('the load');
  const missing = decodeScene(s);
  drawn = true;
  hintEl.style.opacity = 0;
  say(missing.length ? `Loaded  ·  ${missing.length} unknown left out` : 'Loaded', true);
}, false, 'load');

// Save and Load moved out of Tools and in with the presets. A save is a scene, which is
// the more honest grouping, and it is what makes room for Finds in Tools without either
// row getting to nine chips. The mis-tap risk that put them in Tools originally — reaching
// for Gas and hitting Load — is what Undo is for now.
// Appended after the presets below, so the row reads Candle…Gas, Save, Load.

// Scene chips live in their own holder for the same reason the tools do: a Save that
// is halfway through asking must not be rebuilt out from under itself.
SCENES.forEach(s => scenesEl.appendChild(
  actionChip(s.name, ()=>loadScene(s), false, 'scene-' + s.name.toLowerCase())));
scenesEl.appendChild(saveBtn);
scenesEl.appendChild(loadBtn);

showDrawer(0);

/* The readout, which is the only label on the page that can afford to change often.
   It carries the current tool until the pointer is over the dark, and the cell under
   the pointer while it is. On a phone there is no hover at all, so before this it
   read "—" until you were already dragging — by which point you had found out what
   the tool was by using it. */
const roEl = document.getElementById('ro');
const hintEl = document.getElementById('hint');
let drawn = false;                                 // has anything been drawn yet?

const toolName = () => tool==='match' ? (matchLit > 0 ? 'Flame' : 'Match out')
                     : tool==='erase' ? 'Erase'
                     : tool===VENT    ? `Vent · ${M[ventFeed].n}`
                     : M[tool].n;
function say(msg, force){
  if (findFlash > 0 && !force) return;   // a discovery holds the line while it shows
  roEl.textContent = msg;
}
function sayTool(){
  // The panel says this now, in full, over the scene. The readout still carries it for
  // anyone who has the panel open and is looking at the tray instead.
  if (ventAsking){ say('Vent — pick what it pours', true); return; }
  const how = shape === 'free' ? '' : `  ·  ${shape}`;
  say(`${toolName()}  ·  brush ${brush}${how}`);
}

/* The panel that asks what the vent should pour.

   The version before this put the tray into a waiting state and said so in the readout,
   which is a line of small grey text in the top corner of the scene. Reported back, and
   fairly: you tap Vent, nothing you are looking at changes, and the only thing telling
   you that the next tap means something different is a caption most people will never
   read. An invisible mode with a caption is still an invisible mode.

   So it is a panel over the scene with every option on it, and it cannot be missed.
   Over the scene rather than in the tray because twenty-odd materials are not a row and
   the tray must not change height.

   The list is built from GROUPS rather than typed out, so a material added to a drawer
   is ventable the same day and nobody has to remember this file exists. */
const pickEl   = document.getElementById('ventPick');
const gridEl   = document.getElementById('ventGrid');

function ventOptions(){
  const out = [];
  for (const g of GROUPS){
    if (typeof g.items === 'string') continue;
    for (const t of g.items) if (t !== VENT) out.push(t);
  }
  return out;
}

ventOptions().forEach(t => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.pour = t;
  const c = M[t].col;
  b.innerHTML = `<span class="sw" style="background:rgb(${c[0]},${c[1]},${c[2]})"></span>` +
                `<span class="lb">${M[t].n}</span>`;
  b.addEventListener('click', ()=>{ setVentFeed(t); closeVentPicker(); sayTool(); });
  gridEl.appendChild(b);
});

function openVentPicker(){
  pickEl.hidden = false;
  pickEl.classList.add('open');
  ventAsking = true;
  gridEl.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.pour) === ventFeed)));
}

function closeVentPicker(){
  pickEl.classList.remove('open');
  pickEl.hidden = true;
  ventAsking = false;
}

document.getElementById('ventCancel').addEventListener('click', ()=>{ closeVentPicker(); sayTool(); });
// Tapping the dark around the panel is the other way out, the way every sheet on a
// phone behaves. Only the backdrop itself — a tap that lands on a button inside has
// already been dealt with by that button.
pickEl.addEventListener('click', e => { if (e.target === pickEl){ closeVentPicker(); sayTool(); } });
addEventListener('keydown', e => { if (e.key === 'Escape' && ventAsking){ closeVentPicker(); sayTool(); } });

function setVentFeed(t){
  if (t === VENT || !M[t] || t === E) return;
  ventFeed = t;
  const c = M[t].col, chip = matsEl.querySelector('.chip[data-t="' + VENT + '"]');
  if (chip) chip.querySelector('.sw').style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
  // ...and the chip is rebuilt from `ventFeed` by chipFor whenever the drawer reopens,
  // so this only has to cover the case where it is already on screen.
}

function setTool(t){
  if (t==='match' && matchLit<=0) return;

  // Tapping Vent asks what to pour; tapping it again backs out. Anything else touched
  // while it is asking answers the question rather than changing the tool — which is
  // the one place in the tray where a chip does something other than what it says, so
  // the readout says so for as long as it is true.
  if (t === VENT){
    tool = VENT;
    ventAsking ? closeVentPicker() : openVentPicker();
  } else if (ventAsking && typeof t === 'number' && t !== E){
    // The panel covers the scene, not the tray, so the drawers stay reachable while it
    // is open. Answering from there works as well as answering from the panel.
    setVentFeed(t);
    closeVentPicker();
    tool = VENT;
  } else {
    if (ventAsking) closeVentPicker();
    tool = t;
  }
  // Only the material chips. This used to sweep every chip in the row, which meant
  // anything else sharing it got told it was not selected: tapping Erase while the Tools
  // drawer was open switched the Heat view's own pressed state off underneath it, and
  // the room picker's tick would have gone the same way.
  matsEl.querySelectorAll('.chip[data-t]').forEach(c =>
    c.setAttribute('aria-pressed', String(Number(c.dataset.t)===tool)));
  eraseBtn.setAttribute('aria-pressed', String(tool==='erase'));
  sayTool();
  // The hint is an opening instruction, not a status line. Bringing it back every
  // time the tool changed put a line of text over the middle of the scene, which is
  // exactly where everything you are building is.
  if (!drawn){
    hintEl.textContent = tool==='match' ? 'Touch the dark to apply flame'
                       : tool==='erase' ? 'Erasing'
                       : `${M[tool].n} — draw in the dark`;
  }
}

/* Shapes. Free is the brush; Line and Box are press, drag and release. */
const shapesEl = document.getElementById('shapes');
const shapeBtns = {};
for (const [key, labelName] of [['free','Free'], ['line','Line'], ['box','Box']]){
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = labelName;
  b.setAttribute('aria-pressed', String(shape === key));
  b.addEventListener('click', ()=>setShape(key));
  shapeBtns[key] = b;
  shapesEl.appendChild(b);
}
function setShape(s){
  shape = s;
  anchor = ghost = null;
  for (const k in shapeBtns) shapeBtns[k].setAttribute('aria-pressed', String(k === s));
  sayTool();
}

const brushEl = document.getElementById('brush');
brushEl.addEventListener('input', ()=>{
  brush = +brushEl.value;
  document.getElementById('bval').textContent = brush;
  sayTool();
});

/* ============================================================ input */

let painting = false, raining = 0;

/* One step of undo, taken before a stroke rather than after it.

   The only way back from a stray drag across a finished build was Clear, which throws
   away the whole box — so the recovery for a small mistake was a bigger one. On a phone,
   with a fingertip, that is the difference between building something and giving up.

   A copy of the whole field, which is the honest way to do it: a stroke can put material
   down, erase, displace what was underneath, and apply heat, so there is no small record
   of "what changed" that is not just as big. Six arrays over ~30,000 cells is about
   400kB and one memcpy per stroke — costed below at well under a frame.

   Deliberately one level and no redo. Two things happen a moment apart in this box and
   the simulation keeps running underneath, so a deep stack would be a list of scenes
   that never existed at the moment you go back to them. One step covers the mistake you
   just made, which is the mistake that matters. */
let undoBuf = null;                 // allocated once and written over
let undoHas = false;                // ...so this, not the buffer, says whether it holds one
let undoLabel = '';

/* Written into a buffer that is kept rather than a fresh one each time. `.slice()` was
   the first version: 470kB of new arrays every stroke, and measured at 2.6ms a snapshot,
   all of it handed straight to the collector. `.set()` into a buffer allocated once is
   the same copy without the allocation. */
function snapshot(what){
  if (!undoBuf || undoBuf.W !== W || undoBuf.H !== H){
    const n = W*H;
    undoBuf = { W, H, type:new Uint8Array(n), temp:new Float32Array(n),
                fuel:new Float32Array(n), life:new Float32Array(n),
                vel:new Float32Array(n), feed:new Uint8Array(n), way:new Int8Array(n),
                breath:new Uint8Array(n) };
  }
  undoBuf.type.set(type); undoBuf.temp.set(temp); undoBuf.fuel.set(fuel);
  undoBuf.life.set(life); undoBuf.vel.set(vel);   undoBuf.feed.set(feed);
  undoBuf.way.set(way); undoBuf.breath.set(breath);
  undoHas = true;
  undoLabel = what;
  if (undoBtn) undoBtn.disabled = false;
}

function undo(){
  const u = undoBuf;
  // Refused rather than approximated across a resize. The arrays are a different shape
  // and putting the old one back bottom-aligned would be a guess dressed as an undo.
  if (!undoHas || !u){ say('Nothing to undo', true); return; }
  if (u.W !== W || u.H !== H){
    undoHas = false; if (undoBtn) undoBtn.disabled = true;
    say('The box changed size — nothing to go back to', true); return;
  }
  type.set(u.type); temp.set(u.temp); fuel.set(u.fuel);
  life.set(u.life); vel.set(u.vel); feed.set(u.feed); way.set(u.way); breath.set(u.breath);
  undoHas = false;
  if (undoBtn) undoBtn.disabled = true;
  say(`Undid ${undoLabel}`, true);
}

/* One cell, one rule. Everything that puts material into the box goes through here —
   the brush, a line, a rectangle — so a shape can never quietly behave differently
   from a stroke. */
function paintCell(x, y, solid){
  if (!inb(x,y)) return;
  const i = idx(x,y);
  if (tool === 'match'){
    temp[i] = Math.max(temp[i], MATCH_HEAT);
    // `become`, not `put`: the flame has to keep the heat we just applied. `put`
    // would hand this cell the resting temperature of a fresh flame, which is
    // nothing at all, and the match would light nothing.
    if (type[i]===E && Math.random()<.28) become(x,y,FIRE);
  } else if (tool === 'erase'){
    put(x,y,E);
  } else if (yields(type[i])){
    /* Into a liquid as well as into air and gas, which it would not do before: you could
       only ever build *above* a tank, never in it, so a fish had to be dropped from the top
       and a weight could not be placed on the bottom of a pool.

       Solids and powders still refuse, and deliberately: painting over a wall you meant to
       draw beside is not a feature, and Erase is one tap away.

       It replaces the liquid rather than pushing it aside, so filling a sealed tank with
       sand leaves you less water than you started with. Displacing properly means finding
       somewhere for it to go, and in a sealed tank there is nowhere. */
    // The brush lays down 92% of what it covers, which is what stops a stroke
    // reading as a printed block. A shape is a deliberate edge and lays down all of
    // it: measured, a "solid" rectangle came out 1986 cells of a 2156-cell box, and
    // a wall with eight per cent holes is not a wall — water runs through it, and
    // the next shape you draw fills the gaps with whatever it is made of.
    /* ...except for things that are alive, which a material's own `sparse` asks for. A
       tap with the brush covers about thirty cells, and thirty worms in a heap is not
       thirty worms — it is one lump, of which only the edge can move, and it reads exactly
       like a creature that does not work. A scatter is also simply what a handful of
       insects looks like. `solid` still overrides it: a Box or a Line is a deliberate
       edge, and asking for a rectangle of worms should give a rectangle of worms. */
    /* ...and a thing with `roots` only goes where it could live. Reported from the phone as
       moss that would not move: a thumb round a wooden block put down 114 cells of which
       **100 were hanging in mid-air**, which is not a fault in the spreading rule but a
       hundred cells that were never going to do anything. The brush asks the same question
       the spreading does, so what you paint is what can grow. */
    if (M[tool] && M[tool].roots && !rooted(x, y, tool)) return;
    const density = !solid && M[tool] && M[tool].sparse !== undefined ? M[tool].sparse : .92;
    if (solid || Math.random() < density) put(x,y,tool);
  }
}

function disc(cx, cy, r, solid){
  if (r <= 0){ paintCell(cx, cy, solid); return; }
  for (let dy=-r; dy<=r; dy++)
    for (let dx=-r; dx<=r; dx++)
      if (dx*dx+dy*dy <= r*r) paintCell(cx+dx, cy+dy, solid);
}

function paintAt(cx, cy){
  if (tool === 'match' && matchLit <= 0) return;   // a spent match does nothing
  disc(cx, cy, brush);
  /* Say why nothing is going to happen.

     Reported from the phone with two screenshots thirty seconds apart: moss brushed round a
     wooden block, no change. The rule was working exactly as written — there was no water in
     the scene — and the box said nothing at all about it, which is the same fault the vent
     had before it grew a picker. A rule nobody can see is indistinguishable from a broken
     one, and this file has shipped enough of the second kind to owe the doubt to the first.

     Non-forced, so a discovery still takes the line. */
  const m = M[tool];
  if (m && m.damp !== undefined && !damp(cx, cy, m.damp))
    say(`${m.n} needs water within reach — it will not spread here`);

  /* And the other silence of the same kind. A match is 780°C and thermite catches at 950,
     which is deliberate — you light it with a magnesium ribbon — but holding a flame on it
     and watching nothing happen looks exactly like thermite being broken. It was reported
     that way: "the thermite doesn't burn through obsidian, glass, green, wood". Two of those
     four were a real hole in the table; the other two burn perfectly well once the charge is
     actually alight.

     Read off the table rather than naming thermite, so the next material with an ignition
     point above the match says so too. */
  if (tool === 'match' && matchLit > 0){
    for (let dy=-brush; dy<=brush; dy++) for (let dx=-brush; dx<=brush; dx++){
      if (!inb(cx+dx, cy+dy)) continue;
      const u = M[type[idx(cx+dx, cy+dy)]];
      if (u && u.fuel > 0 && u.ig > MATCH_HEAT){
        say(`${u.n} needs more than a match — ${Math.round(u.ig)}°C, and a match is ${MATCH_HEAT}`);
        return;
      }
    }
  }
}

/* Lines and rectangles. Drawing a straight wall with a thumb is miserable, and every
   scene worth building — a tank, a fuse, a floor — is made of straight edges.

   The brush still means something: it is the thickness of a line, one cell at the
   smallest so a fuse can be a single cell wide. A rectangle is filled; four taps of
   erase inside one gives you a tank. */
function stampLine(x0, y0, x1, y1){
  if (tool === 'match' && matchLit <= 0) return;
  const r = Math.max(0, brush - 1);
  let dx = Math.abs(x1-x0), sx = x0 < x1 ? 1 : -1;
  let dy = -Math.abs(y1-y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let guard = 0; guard < 4096; guard++){
    disc(x0, y0, r, true);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2*err;
    if (e2 >= dy){ err += dy; x0 += sx; }
    if (e2 <= dx){ err += dx; y0 += sy; }
  }
}

function stampBox(x0, y0, x1, y1){
  if (tool === 'match' && matchLit <= 0) return;
  const ax = Math.min(x0,x1), bx = Math.max(x0,x1);
  const ay = Math.min(y0,y1), by = Math.max(y0,y1);
  for (let y=ay; y<=by; y++) for (let x=ax; x<=bx; x++) paintCell(x, y, true);
}

function toCell(e){
  const r = cv.getBoundingClientRect();
  return [ Math.floor((e.clientX-r.left)/r.width  * W),
           Math.floor((e.clientY-r.top )/r.height * H) ];
}

/* Press, drag, release — one gesture, rather than tapping a corner and then hunting
   for the opposite one. There is no hover on a phone, so a two-tap shape would spend
   most of its life as an anchor sitting on screen with nothing showing where the
   other end was going to land. */
cv.addEventListener('pointerdown', e=>{
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const [x,y] = toCell(e);
  drawn = true;
  hintEl.style.opacity = 0;
  // Before the first cell of the stroke, not after it. A line or a box does not touch
  // the box until release, but the snapshot has to be of the scene as it was when the
  // finger went down either way.
  snapshot(tool === 'match' ? 'the flame' : tool === 'erase' ? 'the erase' : 'the stroke');
  if (shape === 'free'){ painting = true; paintAt(x,y); }
  else { anchor = [x,y]; ghost = [x,y]; }
});

cv.addEventListener('pointermove', e=>{
  const [x,y] = toCell(e);
  if (inb(x,y)) say(`${M[type[idx(x,y)]].n}  ·  ${Math.round(temp[idx(x,y)])}°C`);
  if (painting) paintAt(x,y);
  else if (anchor) ghost = [x,y];
});

function endStroke(){
  if (anchor && ghost){
    if (shape === 'line') stampLine(anchor[0], anchor[1], ghost[0], ghost[1]);
    else if (shape === 'box') stampBox(anchor[0], anchor[1], ghost[0], ghost[1]);
  }
  anchor = ghost = null;
  painting = false;
}

cv.addEventListener('pointerleave', ()=>{ if (!painting && !anchor) sayTool(); });
addEventListener('pointerup',     endStroke);
addEventListener('pointercancel', ()=>{ anchor = ghost = null; painting = false; });

/* ============================================================ loop */

let last = performance.now();

function frame(now){
  const dt = Math.min(50, now-last); last = now;

  if (matchLit > 0){
    matchLit -= dt/1000;
    const k = Math.max(0, matchLit/MATCH_LIFE);
    stickEl.style.width = (30 + 34*k) + 'px';
    if (matchLit <= 0) matchOut();
  }


  /* How long the work actually takes on the device holding it, which is not the same
     as how long a frame lasts: requestAnimationFrame is pinned to the refresh rate,
     so measuring now-last reported 16.6ms and 60fps on a phone no matter what was in
     the box. It would have said the same thing about an empty one. */
  const t0 = performance.now();
  /* More than one tick a frame. A grid of 3px cells is nearly twice the world of a
     4px one, and the physics runs per cell, so everything took correspondingly longer
     to cross it: the opening scene went from about 30 seconds to reach the wood stack
     to 36.8. Two ticks a frame gives the bigger box back its old pace and then some,
     and there is room for it — 2.3ms of work for a busy scene against a 16.6ms frame,
     on a phone that measured faster than this machine.

     Everything in the model is per tick, so this changes how fast the world runs and
     nothing about how it behaves. The suites step it themselves and are unaffected. */
  for (let s=0; s<STEPS; s++){
    if (raining > 0){
      raining--;
      for (let k=0;k<Math.ceil(W/22);k++){
        const x = (Math.random()*W)|0;
        if (type[idx(x,0)]===E) put(x,0,WATER);
      }
    }
    simTick();
  }
  heatView ? drawHeat() : draw();
  frameMs += (performance.now() - t0 - frameMs) * .05;
  if (findFlash > 0 && --findFlash === 0) sayTool();
  if ((++gaugeTick % 12) === 0) updateGauge();
  requestAnimationFrame(frame);
}

/* The discovery log.

   Every transition in the material table is something to find: what melts into what,
   what a hot liquid sets into, what burns down to what, and what happens when two
   things touch. The list is read off the table rather than written out separately,
   so a reaction added to a material is a reaction the log already knows about and
   there is no second place to forget to update.

   Nothing is locked. The reward for finding one is being told you found it and
   watching the count go up — a record of what you have done rather than a gate in
   front of what you have not. */
/* Everything the box can be caught doing, with the words for it.

   One table now, where there were two derivations of the same thing: this list, and the
   labels written out again at each `found()` call site. Nothing compared them, and the
   count in the corner is the denominator of a progress bar — if they had drifted, the box
   would have been promising a number of discoveries that did not exist, or hiding some
   that did. `test/matchbox-sim.mjs` asserts every key a scene can raise is in here.

   The labels are what the panel shows once a thing has been found. Before that it shows
   the material and a question mark, which is a direction to look in rather than the
   answer — twenty-seven slots reading "Acid — ?" is a to-do list; twenty-seven reading
   "Acid eats through things" is a spoiler. */
const FINDS = (() => {
  const list = [];
  const add = (t, kind, label) => list.push({ key: t+':'+kind, t, label });
  for (let t=0; t<M.length; t++){
    const m = M[t]; if (!m) continue;
    if (m.melt !== undefined && m.into  !== undefined) add(t, 'melt', `${m.n} melts into ${M[m.into].n}`);
    if (m.boil !== undefined && m.into  !== undefined) add(t, 'boil', `${m.n} boils into ${M[m.into].n}`);
    if (m.cool !== undefined && m.sets  !== undefined) add(t, 'cool', `${m.n} sets into ${M[m.sets].n}`);
    if (m.ash  !== undefined && m.ash   !== E)         add(t, 'ash',  `${m.n} burns down to ${M[m.ash].n}`);
    if (m.meets) m.meets.forEach((row,r) =>
      add(t, 'meets'+r, row.tale || `${m.n} + ${M[row.with].n} → ${M[row.become].n}`));
    if (m.eats)  add(t, 'eats', `${m.n} eats through things`);
    if (m.chew)  add(t, 'chew', `${m.n} eats its way through things`);
    if (m.graze) add(t, 'graze', `${m.n} clears away what fire leaves behind`);
    if (m.carries) add(t, 'carry', `${m.n} carries loose grains about and heaps them up`);
    if (m.spread) add(t, 'spread', `${m.n} spreads over damp surfaces`);
    if (m.tills)  add(t, 'till',   `${m.n} turns what fire left into ${M[m.soil].n}`);
    if (m.wither) add(t, 'wither', `${m.n} dries out in the heat`);
    // One rule, both ends of a life: a grub filling up, and what it opens into.
    if (m.becomes !== undefined) add(t, 'becomes', `${m.n} turns into ${M[m.becomes].n}`);
    // Two ways of being somewhere you cannot be, and both are worth finding out about.
    if (m.drown !== undefined) add(t, 'drown', `${m.n} drowns`);
    // The same clock, and a second way to run it out. `breath` was never about water.
    if (m.drown !== undefined) add(t, 'choke', `${m.n} suffocates in what it cannot breathe`);
    if (m.air   !== undefined) add(t, 'air',   `${m.n} cannot breathe air`);
    if (m.ph===0 && m.out !== undefined) add(t, 'burst', `${m.n} goes off`);
  }
  return list;
})();

const FIND_LABEL = new Map(FINDS.map(f => [f.key, f.label]));

const finds = new Set();
let findFlash = 0;

function found(key, label){
  if (finds.has(key)) return;
  finds.add(key);
  findFlash = 150;                 // hold it on screen for a couple of seconds
  say(`Found ${finds.size}/${FINDS.length} — ${label}`, true);
}

/* The list of them, which the box had no way of showing.

   The corner said "FOUND 3/27" and that was all: twenty-four things existed that it would
   never name, mention again, or hint at. A counter with no list is a progress bar for a
   task nobody has been told. This is the same panel as the vent picker — over the stage,
   costing no layout — and it is the answer to "make it more interesting" rather than any
   amount of extra material.

   Unfound rows carry the material's colour and its name and nothing else, so the list
   reads as somewhere to go: eight rows mentioning Acid tell you to go and play with acid,
   without telling you what happens when you do. */
const findPickEl  = document.getElementById('findPick');
const findListEl  = document.getElementById('findList');
const findTitleEl = document.getElementById('findTitle');

function openFindPicker(){
  findTitleEl.textContent = `What the box can do — ${finds.size} of ${FINDS.length}`;
  findListEl.textContent = '';
  // Found ones first, so the list is a record before it is a to-do list. Within each
  // half the table's own order, which groups a material's tricks together.
  const rows = [...FINDS].sort((a,b) => (finds.has(b.key)?1:0) - (finds.has(a.key)?1:0));
  for (const f of rows){
    const got = finds.has(f.key);
    const c = M[f.t].col;
    const row = document.createElement('div');
    row.className = 'find' + (got ? ' got' : '');
    row.dataset.find = f.key;
    row.dataset.got = String(got);
    row.innerHTML = `<span class="sw" style="background:rgb(${c[0]},${c[1]},${c[2]})"></span>` +
                    `<span class="lb">${got ? f.label : M[f.t].n + ' — ?'}</span>` +
                    (got ? '<span class="tick">✓</span>' : '');
    findListEl.appendChild(row);
  }
  findPickEl.hidden = false;
  findPickEl.classList.add('open');
}

function closeFindPicker(){
  findPickEl.classList.remove('open');
  findPickEl.hidden = true;
}

document.getElementById('findClose').addEventListener('click', closeFindPicker);
findPickEl.addEventListener('click', e => { if (e.target === findPickEl) closeFindPicker(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && findPickEl.classList.contains('open')) closeFindPicker();
});

/* What the box is doing as a whole, rather than the one cell under a finger. The air
   figure is the room warming up; the peak is the hottest thing in the box, which is
   the number that says whether anything is close to catching. */
let gaugeTick = 0, frameMs = 16;
const gaugeEl = document.getElementById('gauge');

function updateGauge(){
  let peak = -1e9, airSum = 0, airN = 0;
  for (let i=0; i<temp.length; i++){
    const T = temp[i];
    if (T > peak) peak = T;
    if (type[i] === E){ airSum += T; airN++; }
  }
  const air = airN ? airSum/airN : AMBIENT;
  // The room is shown next to the air because the pair is the interesting reading: the
  // air is what the box has settled at, the room is what it is settling toward, and the
  // gap between them is the fire.
  gaugeEl.innerHTML = `air ${Math.round(air)}°C<br>room ${ROOMS[roomAt].n} ${AMBIENT}°C` +
                      `<br><b>peak ${Math.round(peak)}°C</b>` +
                      `<br>found ${finds.size}/${FINDS.length}` +
                      `<br>${frameMs.toFixed(1)}ms work · ${W}×${H}`;
}

/* ============================================================ boot */

/* A little scene, so the first thing on screen is not an empty box.

   The pieces touch, which they did not before: the oil trail runs from open floor at
   the right all the way to the foot of the wood stack, and the straw is banked
   against its left side. Light the far end of the oil and the fire travels the trail
   and takes the stack — which is what the old comment here said the scene was, while
   the oil actually stopped six cells short of the wood and could not have lit it
   anyway. It is worth the first thing anyone tries being the thing that works.

   `test/matchbox-sim.mjs` lights this scene from the end of the trail and asserts the
   stack catches, so the opening scene cannot quietly stop meaning anything. */
function seed(){
  // Thicknesses in pixels-worth rather than cells, so the scene looks the same
  // whatever CELL is set to. Everything else here is already a fraction of the box.
  const sc = n => Math.max(1, Math.round(n * 4 / CELL));
  const floor = H - sc(3);
  const at = f => (W*f)|0;
  for (let x=0;x<W;x++) for (let y=floor;y<H;y++) put(x,y,STONE);

  // The gappy 82% fill is what makes the stack look stacked rather than poured, but
  // the two columns the kindling is banked against are solid. With gaps there, the
  // straw could burn out beside a hole and the stack never caught: four times in
  // fourteen, which is a scene that works by luck.
  for (let x=at(.30); x<at(.52); x++)
    for (let y=floor-sc(9); y<floor; y++)
      if (x >= at(.52)-sc(2) || Math.random()<.82) put(x,y,WOOD);

  // Kindling on both sides of the stack. The right-hand bank is where the oil trail
  // arrives, and it is there because the handover from a one-cell-deep trail straight
  // into a log was marginal: over ten runs the stack caught nine times, and a scene
  // that works nine times out of ten is a scene that does not work.
  for (let x=at(.18); x<at(.30); x++)
    for (let y=floor-sc(4); y<floor; y++) put(x,y,STRAW);
  for (let x=at(.52); x<at(.57); x++)
    for (let y=floor-sc(3); y<floor; y++) put(x,y,STRAW);

  for (let x=at(.57); x<at(.88); x++) put(x,floor-1,OIL);
}

function boot(){
  build();
  seed();
  setTool(WOOD);
  requestAnimationFrame(frame);
}
boot();

// Resize, but do not re-seed. build() carries the scene across; laying the opening
// scene down again is how a rotation used to erase an hour's work.
/* Fold the tray away. The stage takes the room, which on a phone is about a third
   more box. build() carries the scene across bottom-anchored, so the floor stays the
   floor and the new space appears above it — the same path a rotation takes. */
const trayEl = document.querySelector('.tray');
const foldEl = document.getElementById('fold');
foldEl.addEventListener('click', ()=>{
  const folded = trayEl.classList.toggle('folded');
  foldEl.textContent = folded ? 'Tray' : 'Hide';
  foldEl.setAttribute('aria-expanded', String(!folded));
  build();
  heatView ? drawHeat() : draw();
});

let rt;
addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(build, 220); });
</script>
