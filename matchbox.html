<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Matchbox</title>

<!-- Added to a Home Screen, this opens on its own rather than inside the browser,
     and carries its own icon. Both need saying explicitly:

     · without apple-mobile-web-app-capable, iOS opens a Home Screen bookmark in
       Safari, chrome and all.
     · iOS will not use an SVG for a Home Screen icon, and will not read one out of
       a data: URI either. The favicon below is both, so it was ignored and iOS drew
       its own fallback tile — a white M on a dark square.

     The two companion files are optional. The page runs on its own from anywhere; a
     missing icon or manifest costs the Home Screen appearance and nothing else. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matchbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#241F1B">
<link rel="apple-touch-icon" href="matchbox-icon-180.png">
<link rel="manifest" href="matchbox.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23241F1B'/%3E%3Crect x='14' y='13' width='4' height='15' rx='1.5' fill='%23C4A47C'/%3E%3Cellipse cx='16' cy='10' rx='4' ry='5' fill='%23E8641A'/%3E%3Cellipse cx='16' cy='11' rx='2' ry='2.6' fill='%23FFC93C'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --card:#C4A47C;        /* matchbox kraft */
    --card-deep:#9A7A52;
    --card-dark:#6E5638;
    --strip:#241F1B;       /* striking strip */
    --phos:#A83226;        /* red phosphorus */
    --void:#0B0A09;
    --ink:#1A1512;
    --pale:#EDD9BC;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--strip);
    color:var(--ink);
    font-family:'Space Mono',ui-monospace,monospace;
    display:flex;justify-content:center;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .box{
    width:100%;max-width:520px;height:100%;max-height:940px;
    display:flex;flex-direction:column;
    background:var(--card);
    background-image:
      repeating-linear-gradient(96deg, rgba(110,86,56,.05) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(4deg, rgba(110,86,56,.045) 0 3px, transparent 3px 7px);
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.6);
  }

  /* ---- label ---- */
  .label{
    padding:9px 14px 8px;border-bottom:2px solid var(--card-dark);
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:none;
  }
  .word{font-family:'Anton',Impact,sans-serif;font-size:26px;letter-spacing:.045em;
    color:var(--ink);line-height:1;text-transform:uppercase}
  .word em{font-style:normal;color:var(--phos)}
  .meta{font-size:10px;letter-spacing:.16em;color:var(--card-dark);text-transform:uppercase;
    text-align:right;line-height:1.5;white-space:nowrap}
  /* Folding the tray away is the only thing that buys the stage a real amount of
     room. Tightening the chips only made them harder to hit: the tray came down by
     eight pixels and the targets went under a fingertip, which is a bad trade. */
  .fold{flex:none;align-self:center;padding:6px 9px;min-height:30px;
    border:1.5px solid var(--card-dark);border-radius:3px;background:rgba(255,255,255,.13);
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink);cursor:pointer}
  .fold:focus-visible{outline:2px solid var(--phos);outline-offset:1px}
  .tray.folded{display:none}

  /* ---- the void ---- */
  .stage{position:relative;flex:1;min-height:0;background:var(--void);
    border-top:1px solid #000;border-bottom:1px solid #000;overflow:hidden}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
  /* Both of these sit over the scene, and the scene is whatever has been built in
     it. Grey on near-black reads well and grey on a box packed with sand does not,
     so they carry their own shade with them. */
  .readout,.gauge{position:absolute;top:7px;font-size:10px;letter-spacing:.12em;
    color:#b0a08c;pointer-events:none;text-transform:uppercase;
    text-shadow:0 0 3px #000, 0 1px 2px #000}
  .readout{left:9px}
  .gauge{right:9px;text-align:right}
  .gauge b{font-weight:400;color:#ffb066}
  /* Clear of the floor: at the foot of the stage this sat on top of the opening
     scene, which is exactly where everything happens. */
  .hint{position:absolute;bottom:26%;left:0;right:0;text-align:center;font-size:10.5px;
    letter-spacing:.1em;color:#7a6650;pointer-events:none;text-transform:uppercase;
    transition:opacity .5s}

  /* ---- what the vent should pour ----
     Over the stage rather than in the tray, and that placement is the whole reason it
     is allowed to exist. Twenty-odd materials cannot be a row, and the tray is not
     permitted to change height — three separate reports of the scene moving under a
     thumb came from it doing exactly that. An absolutely positioned panel inside
     .stage costs no layout at all: the tray, the strip and the canvas do not know it
     is there. */
  .picker{position:absolute;inset:0;display:none;z-index:3;
    background:rgba(11,10,9,.86);backdrop-filter:blur(2px);
    flex-direction:column;overflow:auto}
  .picker.open{display:flex}
  /* Pinned, because the way out has to be reachable from wherever you have scrolled to.
     Measured at 320x568 with the real font: twenty-four options are 441px of content in
     a 348px panel, so the list scrolls — and with Cancel at the bottom it sat below the
     fold, with no backdrop left showing to tap either. The only way out was a key on a
     device that has no keys. */
  .picker .phead{position:sticky;top:0;flex:none;display:flex;align-items:center;
    justify-content:space-between;gap:10px;padding:11px 12px 9px;
    background:rgba(11,10,9,.96)}
  .picker h2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--pale);font-weight:400;margin:0}
  .picker .grid{display:grid;gap:5px;flex:none;padding:0 12px 14px;
    grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  /* The finds are a list rather than a grid: they are sentences, not swatches, and a
     sentence in a 74px column is not a sentence. */
  .picker .list{display:flex;flex-direction:column;gap:3px;flex:none;padding:0 12px 14px}
  .picker .find{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;
    background:rgba(255,255,255,.05);font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.03em;text-transform:uppercase;color:#8d7f6d;min-height:26px}
  .picker .find .sw{width:9px;height:9px;border-radius:1px;flex:none}
  .picker .find.got{color:var(--pale);background:rgba(255,255,255,.11)}
  .picker .find .tick{margin-left:auto;flex:none;color:#ffb066}
  /* The chips here are their own thing rather than .chip, because .chip is pinned to a
     fixed 36px and equal widths to keep the tray still, and none of that applies to a
     panel that is floating over the scene. */
  .picker button{
    border:1.5px solid #4a4038;background:rgba(255,255,255,.10);border-radius:3px;
    color:var(--pale);font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;padding:7px 4px 6px;min-height:38px;overflow:hidden;
  }
  .picker button .sw{width:100%;height:6px;border-radius:1px;flex:none}
  .picker button .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .picker button[aria-pressed="true"]{background:var(--pale);color:var(--ink);border-color:var(--pale)}
  .picker button:focus-visible{outline:2px solid var(--phos);outline-offset:1px}
  .picker .cancel{flex:none;padding:8px 13px;min-height:34px;white-space:nowrap}

  /* ---- striking strip ---- */
  .strip{
    flex:none;height:52px;background:var(--strip);position:relative;cursor:pointer;
    background-image:repeating-linear-gradient(45deg, rgba(168,50,38,.30) 0 3px, transparent 3px 6px);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    touch-action:none;user-select:none;
  }
  .strip::after{content:'';position:absolute;inset:0;box-shadow:inset 0 2px 5px rgba(0,0,0,.75);
    pointer-events:none}
  .strip .cue{font-size:10px;letter-spacing:.2em;color:#8a7263;text-transform:uppercase;
    position:relative;z-index:2;transition:color .2s}
  .strip.hot .cue{color:#FFC93C}
  .strip:focus-visible{outline:2px solid #FFC93C;outline-offset:-4px}

  /* the match, drawn */
  .match{position:relative;z-index:2;display:flex;align-items:center;gap:0;transform-origin:right center}
  .stick{width:64px;height:6px;background:linear-gradient(180deg,#E0C79C,#B8996B);border-radius:2px}
  .stick.spent{background:linear-gradient(90deg,#B8996B,#3A2E24 70%,#241F1B)}
  .head{width:15px;height:15px;border-radius:50%;background:var(--phos);margin-left:-3px;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.35)}
  .head.lit{background:radial-gradient(circle at 50% 60%, #FFF3C4, #FFC93C 35%, #E8641A 62%, rgba(140,26,10,0) 78%);
    width:30px;height:34px;border-radius:50% 50% 45% 45%;margin-left:-8px;box-shadow:none;
    animation:flick .16s infinite alternate}
  .head.out{background:#2E2620}
  @keyframes flick{from{transform:scaleY(1) translateY(0)}to{transform:scaleY(1.14) translateY(-1.5px)}}

  /* ---- tray ---- */
  .tray{flex:none;padding:7px 8px 9px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;gap:5px;flex-wrap:wrap}
  /* The two rows of chips never wrap, and that is load-bearing rather than tidy.
     Wrapping made the tray taller, and the tray is above the stage, so the scene moved
     under your finger — reported from the phone twice over: the Fuel drawer pushing
     Rubber onto a line of its own and stretching it the width of the screen, and Clear
     growing to "Clear — sure?" mid-confirm, which reflowed the row, wrapped Load, and
     shifted the whole box up by ~86px between the tap that asked and the tap that
     answered.
     `flex:1 1 0` is the other half: every chip in a row is the same width whatever its
     label says, so text can change length without moving anything at all. */
  #mats,.tabs{flex-wrap:nowrap}
  .chip{
    /* max-width so a drawer with one thing in it does not stretch that one thing across
       the whole screen. That is the shape of the very first complaint about this tray —
       Rubber alone on a wrapped row, full width — and a Life drawer holding a single
       creature would have reproduced it exactly, at 377px. Every chip is capped the same,
       so widths within a row still match and nothing can move by changing its label. */
    flex:1 1 0;min-width:0;max-width:112px;overflow:hidden;padding:7px 4px 6px;border:1.5px solid var(--card-dark);
    background:rgba(255,255,255,.13);border-radius:3px;cursor:pointer;
    font-family:'Space Mono',monospace;font-size:var(--chipfs,9.5px);letter-spacing:.02em;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    /* A fixed height, not a minimum, and it is the same in every drawer.
       Two things were changing it and both moved the scene, because the tray sits above
       the stage and a shorter tray is a taller stage. Material chips carry a 6px colour
       swatch and the gap under it and the Scene and Tools chips had none, so those two
       drawers came out 32px against 36 — reported from the phone as the box sliding on
       the way into Tools. And the label fitting below shrinks the type to make eight
       chips fit, which took Fuel to 35px, so the box slid a pixel on the way into Fuel
       as well. Neither is a thing a height should depend on. 36px is still a fingertip. */
    text-transform:uppercase;height:36px;
  }
  .chip:focus-visible{outline:2px solid var(--phos);outline-offset:1px}
  .chip .sw{width:100%;height:6px;border-radius:1px}
  /* A label that no longer fits is clipped with an ellipsis rather than widening its
     chip. Cosmetic where the old behaviour was structural: the worst case now is a
     shortened word, not a scene that jumps. */
  .chip .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--pale);border-color:var(--ink)}
  .chip.act{padding:7px 4px 6px}
  /* Red at rest, not once armed. Nothing arms any more: the one chip wearing this is
     the one in the Clear drawer that wipes the box, and it has to be the odd one out in
     that row before you tap it rather than after. */
  .chip.danger{background:var(--phos);border-color:var(--phos);color:#fff}
  /* Still the same size when it cannot be used — a chip that shrinks or vanishes when it
     is disabled would resize the row, which is the one thing the tray must never do. */
  .chip[disabled]{opacity:.34;cursor:default}

  .tabs{gap:4px}
  .tab{
    flex:1 1 auto;min-width:0;min-height:26px;padding:4px 6px;
    border:1.5px solid var(--card-dark);border-bottom-width:0;border-radius:3px 3px 0 0;
    background:rgba(110,86,56,.18);cursor:pointer;
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--card-dark);
  }
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--pale);border-color:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--phos);outline-offset:1px}

  .bar{display:flex;align-items:center;gap:9px}
  .bar span{font-size:9.5px;letter-spacing:.14em;color:var(--card-dark);text-transform:uppercase;flex:none}
  .shapes{display:flex;gap:4px;flex:none}
  .shapes .chip{flex:0 0 auto;padding:7px 9px 6px}
  input[type=range]{flex:1;accent-color:var(--phos);height:18px}
  input[type=range]:focus-visible{outline:2px solid var(--phos);outline-offset:3px}

  @media (max-height:700px){
    .word{font-size:21px} .strip{height:44px} .tray{padding:7px 8px 9px;gap:6px}
    /* Padding only. This used to set font-size:9px as well, which beat
       `font-size:var(--chipfs)` on specificity and quietly switched the label fitting
       off on exactly the short screens that need it most — measured at 375x667, five
       labels clipped with the fitting doing nothing at all, while the same page at
       393x852 fitted them fine. */
    .chip{padding:5px 3px 4px;height:32px}
  }
  @media (prefers-reduced-motion:reduce){ .head.lit{animation:none} }
</style>
</head>
<body>
<div class="box">

  <div class="label">
    <div class="word">Match<em>box</em></div>
    <div class="meta">Strike the strip<br>Then touch the dark</div>
    <button class="fold" id="fold" type="button" aria-expanded="true"
            aria-label="Hide the tray and give the room to the box">Hide</button>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="readout" id="ro">—</div>
    <div class="gauge" id="gauge"></div>
    <div class="hint" id="hint">Pick a material · draw in the dark</div>
    <div class="picker" id="ventPick" role="dialog" aria-modal="true"
         aria-label="What should the vent pour?" hidden>
      <div class="phead">
        <h2>What should the vent pour?</h2>
        <button class="cancel" type="button" id="ventCancel">Cancel</button>
      </div>
      <div class="grid" id="ventGrid"></div>
    </div>
    <div class="picker" id="findPick" role="dialog" aria-modal="true"
         aria-label="What the box can do" hidden>
      <div class="phead">
        <h2 id="findTitle">What the box can do</h2>
        <button class="cancel" type="button" id="findClose">Close</button>
      </div>
      <div class="list" id="findList"></div>
    </div>
  </div>

  <div class="strip" id="strip" role="button" tabindex="0" aria-label="Striking strip — strike a match">
    <div class="cue" id="cue">Strike</div>
    <div class="match" id="matchEl">
      <div class="stick" id="stick"></div>
      <div class="head" id="head"></div>
    </div>
  </div>

  <div class="tray">
    <div class="row tabs" id="tabs"></div>
    <div class="row" id="mats"></div>
    <!-- Shapes share the brush's line rather than taking one of their own. The tray
         was a fifth of the screen and the stage is the point of the page. -->
    <div class="bar">
      <div class="shapes" id="shapes"></div>
      <input type="range" id="brush" min="1" max="9" value="3" aria-label="Brush size">
      <span id="bval">3</span>
    </div>
  </div>

</div>

<script>
'use strict';

/* ============================================================ materials
   Every material is a row here and nothing else knows about it by name.
   `ignite` is a temperature, not a flag — which is the whole reason a fire
   can fail to catch, smoulder, or run along a fuse and die halfway. */

const E=0, WOOD=1, PAPER=2, STRAW=3, OIL=4, WAX=5, MELT=6, POWDER=7, FUSE=8,
      COAL=9, GREEN=10, STONE=11, STEEL=12, WATER=13, ICE=14, SAND=15,
      FIRE=16, SMOKE=17, STEAM=18, EMBER=19, ASH=20,
      LAVA=21, GLASS=22, MOLTEN=23, OBSIDIAN=24,
      THERMITE=25, MAGNES=26, RUBBER=27, MRUBBER=28, ACID=29, GAS=30, VENT=31, WORM=32,
      MOTH=33, FISH=34, GRUB=35, PUPA=36, ASHBUG=37, ANT=38, MOSS=39, DIRT=40;

// phase: 0 gas (rises)  1 liquid (flows)  2 powder (piles)  3 solid (static)
const M = [];
M[E]      = {n:'—',        ph:3, col:[0,0,0]};
M[WOOD]   = {n:'Wood',     ph:3, col:[122, 82, 46], ig:300, fuel:520, out:2.0, cond:.10, cap:1.0, ash:EMBER, char:30, dens:.7, tough:1.4};
M[PAPER]  = {n:'Paper',    ph:3, col:[214,201,172], ig:210, fuel:70,  out:2.6, cond:.16, cap:.6,  ash:ASH,   char:3,  dens:.8};
M[STRAW]  = {n:'Straw',    ph:2, col:[186,150, 72], ig:170, fuel:55,  out:2.4, cond:.14, cap:.55, ash:ASH,   char:3,  dens:.35};
// Lightened from [46,38,30], which against a void of [11,10,9] made a one-cell-deep
// trail all but invisible — and a trail is the shape oil is usually in.
M[OIL]    = {n:'Oil',      ph:1, col:[ 72, 58, 40], ig:190, fuel:180, out:3.4, cond:.12, cap:.9,  ash:E,     char:10, dens:.85};
M[WAX]    = {n:'Wax',      ph:3, col:[226,218,198], ig:9e9, fuel:0,   out:0,   cond:.09, cap:1.1, melt:62, into:MELT, dens:.96};
// Molten wax does not light. Hold a match to a puddle of it and nothing happens —
// that is the entire reason a candle has a wick, and it is what makes wax different
// from oil rather than a slower version of it. It burns only where something with
// `wick` is standing in it, which is the rule drawFuel() implements.
//
// It was ignitable at 250 and the pool lit itself: 158 wax cells and a wick became a
// 126-cell fire that ate the whole candle in thirteen seconds. Raising the figure to
// 420 only moved the problem — a wick burns at 1150, so the wax right beside it still
// caught, and burned off the fuel the wick was supposed to be drinking.
M[MELT]   = {n:'Wax',      ph:1, col:[214,198,160], ig:9e9, fuel:220, out:2.1, cond:.11, cap:1.1, ash:E, dens:.95, flow:.25};
M[POWDER] = {n:'Powder',   ph:2, col:[ 58, 56, 58], ig:150, fuel:14,  out:9.0, cond:.30, cap:.4,  ash:SMOKE, char:2,  dens:1.3};
// A fuse has to carry a front along itself for its whole length or it is a stick.
// `out` at 1.5 was the lowest in the table and the front died about eight cells in.
M[FUSE]   = {n:'Fuse',     ph:3, col:[142,116, 78], ig:200, fuel:150, out:3.2, cond:.10, cap:.7,  ash:ASH,   char:12, dens:.8, wick:1};
M[COAL]   = {n:'Coal',     ph:2, col:[ 34, 32, 34], ig:520, fuel:1500,out:3.0, cond:.13, cap:1.4, ash:ASH,   char:90, dens:1.4, tough:2};
M[GREEN]  = {n:'Green',    ph:3, col:[ 74,104, 54], ig:470, fuel:600, out:1.1, cond:.11, cap:1.9, ash:EMBER, smoky:3.2, char:150, dens:.9};
M[STONE]  = {n:'Stone',    ph:3, col:[104,100, 94], ig:9e9, cond:.20, cap:2.2, dens:2.6, melt:1250, into:LAVA, tough:3.5,
             fleck:[ 82, 79, 74]};
M[STEEL]  = {n:'Steel',    ph:3, col:[142,146,152], ig:9e9, cond:.92, cap:1.6, dens:7.8, melt:1400, into:MOLTEN, tough:4.5};
// `cool:0, sets:ICE` is water freezing, and it is the same rule lava uses to become
// stone rather than anything new — a liquid that falls below its `cool` becomes its
// `sets`. It was missing until the room became adjustable, at which point the coldest
// setting was labelled "water freezes" and did not freeze water, which is a worse fault
// than not having the setting at all. Ice melts above 0 and water freezes below it, so
// there is no temperature where a cell can flip between the two forever.
M[WATER]  = {n:'Water',    ph:1, col:[ 44, 92,132], ig:9e9, cond:.42, cap:6.0, boil:100, into:STEAM,
             cool:0, sets:ICE, t0:12, dens:1.0};
M[ICE]    = {n:'Ice',      ph:2, col:[168,204,222], ig:9e9, cond:.28, cap:3.0, melt:0,   into:WATER, t0:-14, dens:.92, rigid:1, lat:430};
// Its own latent heat, and a large one: melting ice really does cost far more per
// unit than melting wax. Sharing the default meant that opening the box up to the
// room — which it badly needed, or a lava scene simply cooked — took a third of a
// block of ice in ten seconds. Ice is something you put down to hold a fire back;
// it has to last longer than that.
M[SAND]   = {n:'Sand',     ph:2, col:[190,166,116], ig:9e9, cond:.16, cap:1.5, dens:2.7, melt:830,  into:GLASS, tough:1.8};
// Denser than lava, so it sinks into a pour and is surrounded by it. At 1.6 it
// floated to the top and only its underside ever touched anything hot: measured,
// four cells of glass formed and then the sand cooled while the lava beneath it was
// still at 900°C. Quartz is heavier than molten basalt, so this is the right way up.
// 830, and the figure is load-bearing at both ends. Above 780, because that is what
// the match puts into whatever it touches and a dab of a match should not turn a
// beach into glass. Below what a pour of lava can actually achieve: lava arrives at
// 1180°C but it shares that heat with whatever it lands on, and 120 cells of it on
// 80 of sand settles at 789 — measured, with the melting point at 950, which nothing
// in the box could ever reach.
M[FIRE]   = {n:'Fire',     ph:0, col:[232,100, 26]};
M[SMOKE]  = {n:'Smoke',    ph:0, col:[ 58, 54, 50]};
M[STEAM]  = {n:'Steam',    ph:0, col:[178,182,186]};
M[EMBER]  = {n:'Ember',    ph:2, col:[ 84, 40, 22], ig:340, fuel:340, out:1.6, cond:.14, cap:1.0, ash:ASH,   char:20, dens:.7};
/* Wet ash is soil, and that is the second answer to "how do I get rid of ash" — the first
   being the ash bug, which eats it and leaves nothing. This one turns it into something.
   The water is absorbed rather than left behind: a cell of ash costs a cell of water, which
   makes it a trade rather than a tap, and it is what stops one puddle converting a whole
   burnt-out box. */
M[ASH]    = {n:'Ash',      ph:2, col:[174,160,150], ig:9e9, cond:.10, cap:.9,  dens:.45, grain:5,
             meets:[{with:WATER, become:DIRT, they:E, tale:'Ash + Water → Dirt'}]};
/* Soil. It exists so that a fire has somewhere to go other than a floor of grey that stays
   grey — ash → dirt → (later) something growing in it.

   It does not burn, which would leave it indestructible under the rule two sections down,
   so it has a melting point: baked hard enough, earth is rock. Acid eats it too, having no
   `proof`. `ph:2` because soil is loose — it piles, ants can carry it, and moss will root on
   it the way moss roots on anything that is not a gas or a liquid. */
M[DIRT]   = {n:'Dirt',     ph:2, col:[100, 88, 56], ig:9e9, cond:.14, cap:1.6, dens:1.5,
             melt:1150, into:LAVA, tough:1.2, grain:16, fleck:[ 70, 58, 34]};

/* Matter that only exists once something has been hot enough.

   Stone, steel, sand and ash could never become anything at all: no fuel, no melting
   point, nothing. The whole top of the temperature range had nothing to do with
   itself. These are what it is for.

   `cool`/`sets` is the other direction from `melt`/`into` — what a hot liquid turns
   back into as it loses its heat, giving back the latent heat it took to melt.
   `meets` is contact rather than temperature: this touching that makes those. It is
   how lava quenched in water becomes glass rather than stone, which is the same
   thing that happens to it in the world. */
/* Three figures here decide whether lava is lava, and all three were wrong.

   A line of it drawn across the box went from 1180°C to solid stone in 120 ticks —
   under two seconds — leaving a scatter of grey specks hanging in the air. Lava that
   sets before it can flow anywhere is hot gravel.

   cond .07, because molten basalt is a poor conductor, close to wood. At .22 it was
   handing its heat to the air faster than anything else in the table bar steel.
   cap 6.4, because rock carries a great deal of heat for its volume, and this is the
   number that decides how long a pour lasts.
   cool 560, because 760 left only 420°C of headroom before it set, and the whole
   point of lava is the time it spends being liquid. */
M[LAVA]   = {n:'Lava',     ph:1, col:[198, 76, 20], ig:9e9, cond:.07, cap:6.4, dens:2.4,
             t0:1180, cool:560, sets:STONE, flow:.45, glow:1,
             meets:[{with:WATER, become:OBSIDIAN, they:STEAM}]};
/* `proof` is against acid and is deliberate — it is what makes a tank worth building. It
   was also, for a long time, proof against *everything*: no `ig`, and no `melt` either, so
   there was no temperature at any point on the dial that could touch it. Reported from the
   phone as thermite not cutting glass; measured at 2600°C with 0 of 102 cells removed.

   1450 is chosen so a lava pour at 1180 still sits in a glass tank, and thermite does not.
   It melts into lava rather than into a molten glass of its own, which means a window you
   melt and let set comes back as stone: the box has one silicate melt, not three, and that
   is the price of it. Sand → glass → lava → stone is at least a coherent family. */
M[GLASS]  = {n:'Glass',    ph:3, col:[172,204,206], ig:9e9, cond:.18, cap:1.2, dens:2.5,
             proof:1, melt:1450, into:LAVA};
/* Widening the liquid window to 1500→1120 was not enough on its own, because a window
   is only worth what it takes to cross it. Traced: one molten cell in open air fell
   1500→1268 in five ticks and had set by tick nine. A pool of 150 was half set in
   thirteen. Lava, after its fix, takes 1274. Molten steel was the faster of the two by
   a hundred times, and it is the one that is supposed to run.

   cap 5.0, not 1.5, and this is the real error rather than a tuning choice. `cap` is
   heat per unit volume, and steel's is close to water's — 3.5 against 4.2 — so on a
   scale that puts water at 6.0, steel belongs near 5.0, not at a quarter of it. At 1.5
   a cell had 570° worth of heat to shed before it set; it now has 2650, against lava's
   3968. Metal should still give up a pour sooner than rock does. It should not lose it
   inside a fifth of a second.

   t0 1650, not 1500. Melting through steel needs `melt + MELT_THRU` = 1460, so being
   born at 1500 left forty degrees of cutting headroom in a cell shedding forty-six a
   tick. Measured against the old figures: at tick 0, 150 of 150 cells could cut steel;
   by tick 10, none could. The melt-through rule was live code that never fired. A
   furnace pour is 1600-1650°C, so this is the honest number as well as the working one.

   cool 860, not 1120. Steel freezes at 1400, and 1380 was tried first: that left a
   liquid window twenty degrees wide, so a cut melted through a plate and froze back
   into the hole before it could fall out, leaving the plate thicker than it started.
   1120 fixed the absurdity but not the complaint — half a pool was still solid inside a
   second. This is the same size of licence lava takes (560, against a basalt solidus
   near 1000) and it is taken for the same reason: the point of a molten metal is the
   time it spends being able to go somewhere.

   cond .55, and this one is set for correct ordering rather than for behaviour, because
   measurement says it barely participates. Swept across .55/.45/.34 with everything else
   held, a cell in open air lasted 39/40/41 ticks and half a pool 63/61/47 — no trend
   worth the name. With cap at 5.0 the heat leaves to the room, not sideways into
   neighbours, so `cool` is the lever and `cond` is nearly inert. It sits just under
   solid steel's .92 and above water's .42, which is the only defensible place for a
   liquid metal; an earlier pass had it at .34, i.e. conducting worse than water, on a
   theory about the interface layer that the sweep above does not support. */
M[MOLTEN] = {n:'Molten',   ph:1, col:[240,158, 62], ig:9e9, cond:.55, cap:5.0, dens:7.0,
             t0:1650, cool:860, sets:STEEL, flow:.6, glow:1,
             meets:[{with:WATER, become:STEEL, they:STEAM}]};
/* Volcanic glass — this is literally what the lava in this box turns into when it is
   quenched, so melting it back into lava is the round trip rather than an invention. Same
   hole as glass had: 0 of 102 cells removed at 2600°C, because there was no melting point
   at all. 1250, matching stone, so it is still refractory enough to hold the lava it came
   from at 1180. */
M[OBSIDIAN]={n:'Obsidian', ph:3, col:[ 40, 33, 46], ig:9e9, cond:.19, cap:2.1, dens:2.6,
             proof:1, melt:1250, into:LAVA};

/* Each of these exists because nothing else in the box did the thing it does.

   Thermite is the only thing that gets near steel. Everything that burns tops out
   around 1200°C and steel melts at 1400, so melting steel needed molten steel, which
   is no way to get any. It will not take from a match either — 950 against the
   match's 780 — so it wants magnesium, which is exactly how it is done in the world.
   What it leaves behind is molten iron.

   Magnesium is the one that punishes the reflex. Everything else in the box teaches
   that water puts fires out; this one gets hotter. It lights from a match, which is
   what makes it the way in to thermite.

   Rubber carries fire downward, which nothing did — burning things do not move, so
   fire only ever went up and sideways. It softens into a liquid that is already
   alight and drips, setting light to whatever is underneath.

   Acid destroys without heat, the only verb in the box that is not about fire. It
   wears out as it works, and glass and obsidian shrug it off, so a tank to keep it
   in is worth building.

   Gas is the one whose danger is that you forgot about it. It rises, gathers under
   whatever is above it, and goes off all at once when something finally reaches it. */
// fuel 140, not the 70 it started at. Steel conducts better than anything else in the
// table, so a flash of heat on a plate is spread across the whole plate before any
// one cell can melt: measured, a 70-fuel charge took the steel to 1399°C against a
// melting point of 1400 and then went out. Thermite is a sustained ferocious burn
// rather than a bang, and the length of it is the point.
M[THERMITE]={n:'Thermite', ph:2, col:[134, 88, 66], ig:950, fuel:140, out:15.0, cond:.18, cap:1.0,
             dens:2.2, char:24, peak:2450, ash:MOLTEN, rad:[.08,.08,.10,.74]};
M[MAGNES]  ={n:'Magnesium',ph:3, col:[196,198,204], ig:430, fuel:150, out:9.0,  cond:.55, cap:1.0,
             dens:1.7, char:18, peak:2100, ash:ASH,
             // Burning, and only burning: a cold block of it sits in water quite happily.
             meets:[{with:WATER, become:MAGNES, they:STEAM, onlyAbove:520, addHeat:520,
                     tale:'Magnesium + Water → a much worse fire'}]};
M[RUBBER]  ={n:'Rubber',   ph:3, col:[ 44, 42, 46], ig:340, fuel:220, out:3.0,  cond:.09, cap:1.3,
             dens:.95, char:24, smoky:3.0, ash:ASH, melt:200, into:MRUBBER, lat:90};
M[MRUBBER] ={n:'Rubber',   ph:1, col:[ 62, 50, 44], ig:270, fuel:200, out:3.4,  cond:.10, cap:1.2,
             dens:1.05, char:6, smoky:3.4, ash:E, flow:.5};
M[ACID]    ={n:'Acid',     ph:1, col:[132,196, 56], ig:9e9, cond:.24, cap:2.4,
             dens:1.2, fuel:12, eats:1, boil:180, into:SMOKE, t0:18};
// fuel 12: a dozen cells eaten and the drop is gone. At 26 a splash could get through
// most of a scene, and with bites now rare enough to watch, it would have taken over
// a minute of real time per cell to find that out.
// `tough` is how well a material resists being eaten — how many bites it takes rather
// than whether acid works on it at all. Without it steel dissolved as fast as paper.
/* A vent makes matter out of nothing, which everything else in this file refuses to do,
   and it is worth being clear that this is a building tool rather than a material.

   It is one block that emits whatever you tell it to, rather than a lava vent, because
   the general one costs the same to write and a water spring and a gas leak come free.
   What it emits is per cell, in `feed`, so two vents in the same scene can pour
   different things.

   It only ever fills an *empty* neighbour, and that is what keeps it honest. A vent
   buried in what it makes simply stops, so nothing floods the box, and a volcano works
   the way a volcano works: the shaft fills, the lava overflows at the top, runs down the
   outside, cools into stone, and the cone it leaves behind is what the next pour runs
   over. Lava that never set could not build that — it would just fill the box like a
   bath. `proof` and no melting point because a source you can destroy with what it
   pours is not a source. */
M[VENT]    ={n:'Vent',     ph:3, col:[ 78, 74, 84], ig:9e9, cond:.20, cap:2.4, dens:9.9,
             proof:1, tough:9e9};
// `leak` instead of `span`: it does not fade on a clock, it escapes at the top of the box
// and only while it is touching it. Contained, it keeps. See the two-ways-out note in
// react() for why those are different things.
/* The first thing in here that is alive, and it is a cell like everything else.

   It is a **Worm**, and it was a `BUG` in here for a while after the tray stopped saying so.
   The mismatch was never about saves — `SAVE_KEY` handles those — it was that renaming it
   touches fifty comments explaining a walk that has not changed. It reads oddly enough to
   ask about, so it is one word everywhere now.

   Which leaves the honest note it was standing in for: **this thing walks on top of surfaces
   and climbs a step, which is more insect than worm.** The name is ahead of the behaviour.

   That is the whole design decision. As a cell it inherits the box: it has a temperature,
   so fire kills it through the same rule that burns straw; acid eats it because acid eats
   cells; it saves and loads with no new format; and the one thing it cannot do — swim — is
   a single number in its row, so it adds its own entry to the finds list without a line of
   code. As an object in a separate list none of that would come free, and every bit of it
   would be new code of the kind this file keeps shipping — rules that read perfectly and
   never fire.

   `ig` 190 and `char` 4: it catches easily and quickly, because the interesting thing
   about a creature in this box is that it is the softest thing in it. `fuel` 20 so it goes
   out fast and leaves ash. `dens` and `ph:3` because it is not a powder and does not
   trickle — everything it does about gravity and walking is in moveLife().

   **And it finally has a verb of its own.** For a long time this was the generic wanderer:
   it walked, it fled heat, and that was all, which is why it was still called `BUG` in the
   source after the tray stopped saying so. It composts — `tills` is ticks per turn of a cell
   of what fire left behind into `soil` — and it burrows through that soil by swapping with
   it, the way a fish swims rather than the way a grub tunnels, so the ground does not
   collapse behind it.

   That makes it the grub's opposite in the way the moth is the worm's: **the grub eats
   structure and the worm makes ground.** It is also the ash bug's opposite — both clear a
   burn, one by removing it and one by turning it into something. */
M[WORM]    ={n:'Worm',     ph:3, col:[176, 92,132], ig:190, fuel:20, out:1.2, cond:.30, cap:1.0,
             char:4, ash:ASH, dens:1.1, tough:.6, sparse:.16, drown:150, alive:1,
             tills:55, soil:DIRT};
/* The worm's opposite, and deliberately so: it flies, and warmth pulls it in rather than
   driving it off. Everything else in this box treats heat as a hazard. One thing that
   treats it as a destination turns a candle into a lure and a fire into a funeral.

   `ig` 120 and `char` 2, the lowest in the table, because a moth that reached a flame and
   survived it would be missing the point.

   It does not fall — flight is the whole of what it adds — so `ph:3` keeps the falling
   pass away from it and everything it does is in moveLife(). The cost of that is a moth
   hovering in a sandfall dams it, which is odd and rare and noted here rather than
   solved. */
// `out` 0.1, which is the lowest in the table by a long way. A moth is a scrap of dust —
// it should go up and be gone, not throw enough heat to light the moth beside it. At 0.8 a
// swarm was a fuse: one reached the candle, and the fire walked through the whole cloud
// from body to body, upwards, because each new flame rose and the rest followed it.
M[MOTH]    ={n:'Moth',     ph:3, col:[236,196,232], ig:120, fuel:8, out:0.1, cond:.28, cap:.7,
             char:2, ash:ASH, dens:.4, tough:.5, sparse:.10, drown:90, alive:1};
/* The third one, and the first that lives *inside* something rather than on top of it.
   Water stops being a way to put fires out and becomes a place.

   It does not burn — it is wet — so it has no `ig`, and that leaves `life` free to count
   the only clock a fish has: how long it has been out of water. Which is the same thing
   `life` means everywhere else in this file, a cell counting how long it has been in the
   predicament it is in.

   Everything else about it falls out of the box rather than being written for it. Boil
   the tank and the water leaves; freeze it and the water becomes ice; either way there is
   nothing left to breathe. The Room dial is what a fish is really for. */
M[FISH]    ={n:'Fish',     ph:3, col:[ 84,160,168], ig:9e9, cond:.42, cap:3.0, dens:1.0,
             tough:.5, sparse:.14, air:200, alive:1};
/* The fourth, and the first that *removes* material. Everything alive so far reacts to the
   box; this one rearranges it. Put a grub in a log and come back to a log with galleries
   cut through it, and then hold a match to what is left.

   `chew` is the whole of it: ticks per bite, as a dice roll rather than a counter, so it
   needs no state of its own. What counts as food is read off the food's own row — solid
   enough to tunnel through, and made of something that would burn — so a fuel added
   tomorrow is on the menu without a line written here.

   Slower than a worm in the open and slower still while eating, because the interesting
   thing about it is the shape it leaves behind, and a fast one just deletes the log. */
M[GRUB]    ={n:'Grub',     ph:3, col:[220,248,196], ig:200, fuel:24, out:1.0, cond:.26, cap:1.1,
             char:5, ash:ASH, dens:1.1, tough:.6, sparse:.13, drown:120, alive:1,
             chew:67, pupa:30, becomes:PUPA};
/* What a grub is for, in the end. Thirty cells eaten and it stops, seals itself up, and
   five seconds later a moth comes out — so the creature that eats the log and the creature
   that flies into the candle are the same animal at two ages, and a scene can now run from
   one to the other without you touching it.

   The population is still fixed, and exactly: one grub in, one moth out. That was the
   condition for adding it at all — the box has no way to make a creature, and this is not
   one, it is the same cell wearing a different row of the table.

   It is `made, never placed`: no `sparse`, and not in the tray. `alive:1` keeps it off the
   grubs' menu, which is the reason that field exists rather than `edible` borrowing
   `sparse` — a pupa never comes out of a brush, so `sparse` would have been a lie about it
   and grubs would have eaten their own chrysalises.

   It cannot move, and does not try to. A chrysalis hanging in the gallery its grub cut is
   what one looks like. `ig` 170 and `char` 3, because a sealed grub is the most helpless
   thing in the box, and `drown` because being underwater is no better sealed in than out. */
M[PUPA]    ={n:'Pupa',     ph:3, col:[188,116, 68], ig:170, fuel:16, out:0.9, cond:.24, cap:1.0,
             char:3, ash:ASH, dens:1.1, tough:.5, drown:100, alive:1,
             hatch:300, becomes:MOTH};
/* The fifth, and the only one that is interested in what has already happened. Every fire in
   this box leaves a floor of ash and embers that nothing ever touches again — measured, a
   scene left running for three minutes stops changing after one, and the ash from the first
   minute is still there. An **Ash bug** eats it.

   `graze` is ticks per mouthful, and what counts as a mouthful is derived rather than
   listed: anything named as some material's `ash`, minus the ones that are not there to be
   eaten. So it is ash and embers today, and a fuel added tomorrow that burns down to
   something new puts that on the menu with nothing written for it.

   **Its one constraint is inherited rather than written, which is why it is the right one.**
   An ember is hot. An ash bug that walks into a fresh burn heats up, panics and leaves on
   exactly the machinery the worm uses, and burns if it stays — so it can only clear a fire
   once the fire has gone out. That was going to be a damp requirement, which would have been
   written, new, and wrong: fire dries everything, so needing water would have kept it out of
   the one place it exists for. */
M[ASHBUG]  ={n:'Ash bug', ph:3, col:[124,136,184], ig:210, fuel:18, out:1.0, cond:.30, cap:1.1,
             char:5, ash:ASH, dens:1.2, tough:.8, sparse:.15, drown:140, alive:1, graze:22};
/* The sixth, and the first that moves the box around rather than adding to it or taking
   from it. An **Ant** picks a loose grain up, carries it, and puts it down somewhere else.

   **The rule is two lines and the behaviour is not in either of them.** It lifts a grain
   more readily the fewer of its kind are around it, and puts one down more readily the more
   there are. Nothing tells it where a heap should be, or that heaps are wanted; scattered
   sand still gathers into heaps, and sand and ash gather into *separate* heaps, because a
   grain is only ever counted against its own kind. This is the one piece of borrowed
   cleverness in the file — it is the classic ant-sorting rule — and it is here because it is
   the only way a creature this simple produces something you would want to look at.

   `carries` is the marker and the finds entry; `ANT_TAKE` and `ANT_DROP` are the two
   eagernesses. What it can lift is read off the grain: a powder, and not alive.

   The load lives in `feed`, the array a vent keeps its payload in. An ant is not a vent, so
   the field is free, and it is already saved and already swapped — an ant put down mid-
   carry is still carrying when the scene comes back. */
M[ANT]     ={n:'Ant',      ph:3, col:[136, 44, 44], ig:200, fuel:18, out:1.1, cond:.30, cap:1.0,
             char:4, ash:ASH, dens:1.1, tough:.6, sparse:.14, drown:130, alive:1, carries:1};
/* The seventh, and **the one that breaks the rule the other six were built to keep.**

   Every creature so far conserves its own number: what you put in the box is what is in the
   box, and the pupa was allowed only because one grub goes in and one moth comes out. Moss
   multiplies. That is the whole of what it adds and it is worth exactly one exception,
   because a box where nothing can ever increase has no way to show you growth.

   Three things keep the exception from eating the file. It only spreads onto a surface, so it
   creeps over what you built rather than filling the air. It only spreads where there is
   water within `damp` cells, so a scene decides how much of it there can be. And it dies of
   heat long before anything catches, so a fire clears it.

   **It withers rather than burns, and that is not a detail.** It used to burn like any other
   soft fuel, which made a loop nobody designed: moss burns down to ash, moss grows on ash,
   that moss burns. Reported from the phone as moss expanding with the ash and containing it.
   Measured on a mossy build with one arm lit — **480 cells of wood burnt, and 1714 cells of
   ash on the floor afterwards.** Three and a half times as much ash as there was fuel; the
   scene was manufacturing matter. With `wither` it is 480, exactly one ash per cell of wood.

   So the burning fields are gone from this row rather than left sitting there unreachable:
   the life pass runs before `react()`, so a moss cell crossing 70°C is dead before anything
   ever looks at its ignition point. A field that can never fire is the single thing this
   file has shipped most often by accident, and leaving `ig` on a row that cannot reach it
   would be one more.

   `spread` is ticks per attempt as a dice roll, like every other pace in here. */
M[MOSS]    ={n:'Moss',     ph:3, col:[ 92,152, 96], ig:9e9, cond:.14, cap:1.2,
             dens:.9, tough:.5, sparse:.30, alive:1,
             spread:40, damp:40, roots:1, wither:70};
/* `chokes` is why this one and not smoke or steam. Gas is the gas that *stays*: it only
   leaves at the top of the box, so it pools and fills a room, and a creature under it is
   under it for as long as the room holds.

   Smoke and steam were measured with the same field and it changed nothing anywhere. Four
   scenes: a fire beside worms on a floor, a fire in a sealed room with worms in it, moths
   flying up a candle's plume, and worms sealed in gas. The sealed room came out 10 of 10
   alive with or without it, because smoke rises off a creature standing on a floor faster
   than a breath clock runs. A rule that fires in none of the scenes anybody builds is the
   thing this file has shipped most often, so it is not here. */
M[GAS]     ={n:'Gas',      ph:0, col:[ 92,104, 88], ig:250, out:9.0,  cond:.09, cap:.45,
             leak:.02, peak:1500, chokes:1};

/* The tray, in drawers.

   Fourteen materials already wrapped to two rows on a phone, and the plan is many
   more than fourteen. A flat tray does not scale: every material added costs a slice
   of the stage, which is the part of the page worth having. Grouped, one row shows
   one drawer and the tray stops growing no matter how much goes in it.

   `TOOLS` is a drawer like any other. It holds the things that are not materials —
   the eraser, the weather, the views — and later the presets and the saves. */
const GROUPS = [
  { name:'Fuel',  items:[WOOD, PAPER, STRAW, FUSE, COAL, GREEN, POWDER, RUBBER] },
  { name:'Wet',   items:[WATER, OIL, ICE, ACID] },
  { name:'Solid', items:[STONE, STEEL, SAND, DIRT, WAX, GLASS, OBSIDIAN] },
  { name:'Hot',   items:[LAVA, MOLTEN, EMBER, THERMITE, MAGNES, GAS, VENT] },
  { name:'Life',  items:[WORM, MOTH, FISH, GRUB, ASHBUG, ANT, MOSS] },
  { name:'Scene', items:'scenes' },
  { name:'Tools', items:'tools' },
];
// Where the room and vent pickers hand the tray back to when they are done.
const TOOLS_DRAWER = GROUPS.findIndex(g => g.items === 'tools');

/* What a saved scene calls each material, which is deliberately not what the tray
   calls it.

   A save has to survive materials being added, because they will be, and the numbers
   above are positions in a list — insert one in the middle and every save ever written
   becomes a different scene. So a save stores names.

   It cannot store the *display* name, and finding out why was the whole reason this
   table exists rather than a one-line `M[t].n`. Two pairs collide: WAX and MELT are
   both 'Wax', RUBBER and MRUBBER are both 'Rubber'. Saving by display name would have
   quietly turned every puddle of molten wax into a solid block of it on the way back
   in — a corruption that throws nothing, warns nothing, and looks like a scene you
   drew slightly wrong.

   Keeping the two apart also means the tray is free to rename anything it likes. These
   strings are a file format: once written they are frozen, and a material dropped from
   the table should keep its key here so old saves can say what is missing rather than
   silently losing a cell. `test/matchbox-sim.mjs` asserts every material has one and
   that no two share. */
const SAVE_KEY = [];
SAVE_KEY[E]='air';            SAVE_KEY[WOOD]='wood';        SAVE_KEY[PAPER]='paper';
SAVE_KEY[STRAW]='straw';      SAVE_KEY[OIL]='oil';          SAVE_KEY[WAX]='wax';
SAVE_KEY[MELT]='wax-molten';  SAVE_KEY[POWDER]='powder';    SAVE_KEY[FUSE]='fuse';
SAVE_KEY[COAL]='coal';        SAVE_KEY[GREEN]='green';      SAVE_KEY[STONE]='stone';
SAVE_KEY[STEEL]='steel';      SAVE_KEY[WATER]='water';      SAVE_KEY[ICE]='ice';
SAVE_KEY[SAND]='sand';        SAVE_KEY[FIRE]='fire';        SAVE_KEY[SMOKE]='smoke';
SAVE_KEY[STEAM]='steam';      SAVE_KEY[EMBER]='ember';      SAVE_KEY[ASH]='ash';
SAVE_KEY[LAVA]='lava';        SAVE_KEY[GLASS]='glass';      SAVE_KEY[MOLTEN]='steel-molten';
SAVE_KEY[OBSIDIAN]='obsidian';SAVE_KEY[THERMITE]='thermite';SAVE_KEY[MAGNES]='magnesium';
SAVE_KEY[RUBBER]='rubber';    SAVE_KEY[MRUBBER]='rubber-molten';
SAVE_KEY[ACID]='acid';        SAVE_KEY[GAS]='gas';           SAVE_KEY[VENT]='vent';
SAVE_KEY[WORM]='worm';        SAVE_KEY[MOTH]='moth';         SAVE_KEY[FISH]='fish';
SAVE_KEY[GRUB]='grub';        SAVE_KEY[PUPA]='pupa';
/* These are allowed to disagree with the tray, and that is the whole point of the table
   being separate: a display name can change without a saved scene noticing.

   What that buys is that a rename is never *forced* to break saves — not that a key may
   never be tidied. This one read 'woodlouse' for a day, left over from before the tray
   called it an Ash bug, and it was changed here while nothing in the world depended on it.
   Once a save exists that anybody minds losing, the rule bites and these stop moving. */
SAVE_KEY[ASHBUG]='ash-bug';   SAVE_KEY[ANT]='ant';         SAVE_KEY[MOSS]='moss';
SAVE_KEY[DIRT]='dirt';

const TYPE_OF_KEY = new Map(SAVE_KEY.map((k,t) => [k,t]));

/* ============================================================ grid

   Temperatures are °C. Energy is temperature × capacity, and that distinction is
   the spine of the whole model: the same energy poured into water and into paper
   must not move them by the same amount. Every place heat changes hands below, it
   is moved as energy and divided by the capacity of whatever receives it. */

/* The room, and it is a `let` because it is worth turning.

   This number was already the one the whole box relaxes toward: gas sheds heat to it
   every tick through ROOM_LOSS, and all four walls do the same through EDGE_LOSS. Making
   it adjustable adds almost no code and a great deal of behaviour, because everything
   else in the file already keys off it — the ignition table turns into a dial:

     below 0  water freezes            210  paper
        62    wax melts                250  gas
       100    water boils off          270  rubber
       150    powder                   300  wood
       170    straw                    430  magnesium
       190    oil                      470  green wood
       200    fuse                     520  coal

   The rendering keys off it too and needs no special case: air only shimmers above
   AMBIENT+18, and the heat view scales from AMBIENT, so both stay meaningful at any
   setting rather than washing the picture out at the hot end. */
let AMBIENT      = 20;
const CELL       = 3;     // pixels per cell. Three rather than four gives about 1.8×
                          // the cells for the same screen — measured on the device,
                          // a busy scene costs 3.0-4.5ms of work at 4px, against a
                          // 16.6ms frame, so there was room. Everything below that is
                          // expressed in cells stays in cells; the two things that
                          // are really about screen size — the brush and the opening
                          // scene — were scaled to look the same as before, and the
                          // brush has since been put back. A brush measured in cells
                          // covers less of the screen here, which is the point: finer
                          // detail in a box with more room in it.
/* Air is a poor conductor — better than nothing and worse than wood — and it moves
   heat by rising, not by conducting. The table had it at .55, better than everything
   except steel, which is backwards and was quietly fatal: every burning cell dumped
   its heat into the air beside it faster than it could push it into the log it was
   touching. Measured on the old figure, a lit wood cell settled at 320°C against an
   ignition point of 300 and held its neighbour at 200 — permanently 100° short. That
   is why nothing spread sideways, and why a fuse, a candle and an oil trail all
   failed at once. Convection, below, is what actually carries heat through air. */
const AIR_COND   = .06;
const AIR_CAP    = .35;
const FLOW       = .12;   // conduction rate — see conduct() for why it cannot go higher
const ROOM_LOSS  = .018;  // air handing heat back to the room, per tick. At .004 a
                          // box with a lava pool in it simply cooked: the air reached
                          // 417°C and stayed there, because the only way out was a
                          // 0.4% nudge a tick against a source that never stopped.
const EDGE_LOSS  = .055;  // ...and the walls of the box, which are open to the room
                          // whatever is against them. Without this a scene packed
                          // solid has no boundary at all and heat only accumulates:
                          // measured, cells over 300°C went from 1% of the box to 13%
                          // and climbing, so everything slowly turned amber.
const BURN       = 6.0;   // energy per unit of a material's `out`, per tick alight
const KEEP       = .5;    // ...of which this much stays put; the rest goes to neighbours
const STEPS      = 1;     // simulation ticks per drawn frame — see frame().
                          //
                          // Was 2 for exactly one build. The bigger grid made the
                          // world take longer to cross, so I sped the world up to
                          // compensate — and between that and holding the brush at
                          // the same size on screen, the extra room cancelled itself
                          // out. A box that behaves identically and is drawn in finer
                          // pixels is not a bigger box. Fire covers the same cells
                          // per second it always did, and there are simply more cells
                          // between one side and the other.
const VENT_EVERY = 10;    // ticks between one vent cell producing anything. Per cell and
                          // staggered by position, so a wide vent is a fast one and a
                          // row of them does not pulse in lockstep.
// Up first: that is what fills a shaft and makes a volcano overflow at the top rather
// than a puddle creep sideways out of the bottom.
const VENT_DIRS  = [[0,-1], [-1,0], [1,0], [0,1]];
const RAIN_TICKS = 420;   // how long a press of Rain keeps raining. At 90 it was a
                          // second and a half, which a fire of any size shrugged off.
const MATCH_HEAT = 780;   // what the match puts into whatever you touch with it
const FIRE_HEAT  = 780;   // a flame, newly lit
const FIRE_DIES  = 360;   // below this a flame is not a flame any more
const FLAME_RAD  = 3.4;   // energy a flame gives the cells around it each tick
const FLAME_PEAK = 1200;  // as hot as combustion alone can drive a cell, unless the
                          // material says otherwise. MAX_T is the ceiling for the box;
                          // this is the ceiling for a fire, and they are not the same
                          // number — raising the first for steel let a wood fire run
                          // at 1650°C, which cooked the air and washed the picture to
                          // cream. Wood flame is about 1100 in the world.
                          //
                          // 1200 rather than 1150 because that is the figure the rest
                          // of the box was balanced against while MAX_T was 1200, and
                          // the candle in particular: bounding the convection leak
                          // took the heat over a wick down with it, and at 1150 the
                          // candle fell from ~1800 ticks to 1104. The leak had been
                          // propping it up.
const MAX_T      = 2600;  // nothing in the box gets hotter than this. It has to clear
                          // steel's melting point or steel can never melt, which is the
                          // same defect as green wood that could never be lit. 2600
                          // now, because thermite burns at 2450 and a ceiling below
                          // that would quietly make it ordinary.
const MELT_HARD  = 500;  // only solids that melt at least this hot can be sunk into
const MELT_THRU  = 60;   // ...and only by a liquid this far over their melting point
const BURN_THRU  = 700;  /* and the same again for things that burn rather than melt: a
                            liquid this far over a fuel's ignition point goes straight down
                            through it instead of sitting on top setting light to it.
                            Large on purpose. At `ig + 60`, molten wax at 600°C would cut
                            through a wooden table, and burning oil would cut through the
                            log it was running over. At 700 it takes lava (1180) or molten
                            metal to do it, which is the picture: something glowing, not
                            something merely alight. */
const ACID_BITE  = .012; // chance an acid cell takes a bite in a tick. At .18 it went
                         // through half of a six-deep wall in four tenths of a second,
                         // which is not corrosion, it is a hole appearing.
const CHAR       = 30;    // charring a cell must do before it catches, if it has no
                          // `char` of its own. See "catching" in react().
const WICK_DRAW  = .34;   // fuel a burning wick takes from the liquid it stands in
const WICK_REACH = 3;     // ...and how far into the pool it can reach for it
const LATENT_MELT= 140;   // energy a cell has to soak up before it can melt
const LATENT_BOIL= 1800;  // ...and before it can boil, taken out of whatever is
                          // touching it. This is the number that puts a fire out.

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});
ctx.imageSmoothingEnabled = false;

// `feed` is the vent's payload: for a VENT cell it holds the material that vent emits,
// and it is zero everywhere else. Its own array rather than a spare field on an
// existing one, because overloading `fuel` to sometimes mean "a material index" is the
// kind of shortcut that reads fine and goes wrong in the dark.
// `way` is which direction a worm is walking, and it is not in the save on purpose: a
// heading is state, like a temperature, and a save stores what was built rather than what
// everything was doing. A loaded worm picks a direction on its first step.
/* `breath` is how long a living thing has been somewhere it cannot survive — a worm under
   water, a fish out of it. Its own array rather than `life`, which would have been the
   natural home: react() decays `life` by 6% a tick for anything below its ignition point,
   so a counter kept there saturates around sixteen and never reaches a threshold of a
   hundred and fifty. It would simply never have fired. */
let W=0, H=0, type, temp, fuel, life, vel, tint, feed, way, breath, img, buf;

/* Sizing the grid, and carrying whatever is already in it across.

   A phone resizes for reasons that have nothing to do with wanting a new box: the
   address bar slides away, the keyboard appears, somebody turns it on its side. This
   used to rebuild the grid and lay the opening scene down on top, so any of those
   wiped what you had built and put your fire out. Anchored to the bottom, because
   what is at the bottom is the floor and it should stay there. */
function build(){
  const r = cv.parentElement.getBoundingClientRect();
  const nw = Math.max(40, Math.floor(r.width  / CELL));
  const nh = Math.max(40, Math.floor(r.height / CELL));
  if (nw === W && nh === H) return;

  const old = W ? { W, H, type, temp, fuel, life, vel, feed, way, breath } : null;

  W = nw; H = nh;
  cv.width = W; cv.height = H;
  const n = W*H;
  type = new Uint8Array(n);
  temp = new Float32Array(n).fill(AMBIENT);
  fuel = new Float32Array(n);
  life = new Float32Array(n);
  vel  = new Float32Array(n);
  feed = new Uint8Array(n);
  way  = new Int8Array(n);
  breath = new Uint8Array(n);
  tint = new Int8Array(n);
  for (let i=0;i<n;i++) tint[i] = (Math.random()*(2*GRAIN) - GRAIN)|0;
  img = ctx.createImageData(W,H);
  buf = img.data;
  for (let i=3;i<buf.length;i+=4) buf[i] = 255;

  if (old){
    const drop = H - old.H;                       // bottom-aligned
    const cols = Math.min(W, old.W);
    for (let y=0; y<H; y++){
      const oy = y - drop;
      if (oy < 0 || oy >= old.H) continue;
      for (let x=0; x<cols; x++){
        const i = y*W + x, j = oy*old.W + x;
        type[i] = old.type[j]; temp[i] = old.temp[j];
        fuel[i] = old.fuel[j]; life[i] = old.life[j]; vel[i] = old.vel[j];
        feed[i] = old.feed[j]; way[i]  = old.way[j]; breath[i] = old.breath[j];
      }
    }
  }
}

const idx = (x,y) => y*W + x;
const inb = (x,y) => x>=0 && x<W && y>=0 && y<H;

// Empty space is air: it carries heat, it rises, and it is what gives heat back to
// the room. The table marks it solid so that anything at all can displace it, so the
// question "is this cell air" has to be asked here rather than read off `ph`.
const gassy = t => t===E || M[t].ph===0;
const capOf = t => { const c = M[t].cap; return c !== undefined ? c : AIR_CAP; };

/* There are two ways for a cell to change, and telling them apart was worth four
   defects on its own.

   `put` introduces new material — your finger, the rain, the opening scene — and it
   arrives at its own temperature. `become` converts what is already there — wax
   melting, wood spending its last fuel, a flame going out — and the heat that was in
   the cell stays in the cell.

   One function did both jobs before, and got each of them the wrong way round. New
   material inherited the temperature of the hole it landed in, so ice arrived at room
   temperature and was water before your finger left the glass, and a splash on a fire
   arrived at 600°C and flashed to steam without cooling anything. Converting in place
   reset the cell to ambient, so a burning oil trail deleted its own heat as it went
   and could not light the log it was running into. */

function put(x,y,t){
  if(!inb(x,y)) return;
  const i = idx(x,y);
  type[i] = t;
  fuel[i] = M[t] && M[t].fuel ? M[t].fuel : 0;
  life[i] = 0;
  vel[i]  = 0;
  // A vent placed by hand pours whatever was last selected. Loading a save assigns
  // `feed` itself immediately after, because a saved vent pours what it was saved with
  // and not what happens to be picked now.
  feed[i] = t===VENT ? ventFeed : 0;
  way[i]  = 0;
  breath[i] = 0;
  temp[i] = M[t] && M[t].t0 !== undefined ? M[t].t0 : AMBIENT;
}

function become(x,y,t){
  if(!inb(x,y)) return;
  const i = idx(x,y);
  type[i] = t;
  fuel[i] = M[t] && M[t].fuel ? M[t].fuel : 0;
  life[i] = 0;
  vel[i]  = 0;
  feed[i] = 0;
  way[i]  = 0;
  breath[i] = 0;
}

/* ============================================================ movement
   Two passes. Falling things are walked bottom-up so a grain cannot fall
   twice in one frame; rising things are walked top-down for the same reason
   in the other direction.

   Falling things have a speed, and lose it to whatever they are falling
   through. Before this, everything in the box moved exactly one cell a tick
   in every medium — measured, a 98-cell drop took 98 ticks for sand in air,
   sand in water, coal in water and ash in water alike. Nothing accelerated
   and nothing was slowed by anything, because there was no speed in the
   model at all: a grain either moved a cell or it did not.

   `dens` decides what can sink through what. It used to be a rule about
   phases — powders sink through liquids, full stop — which meant oil and
   water simply ignored each other and stayed wherever they happened to
   land. */

const GRAVITY  = .12;   // gained per tick
const DRAG_AIR = .94;   // ...against this, so about 1.9 cells a tick in the open
const DRAG_WET = .62;   // ...and about 0.3 in a liquid: six times slower
const CREEP    = .22;   // chance a liquid takes a sideways step when it can,
                        // scaled by the material's own `flow`: wax is not water

const densOf = t => { const d = M[t].dens; return d !== undefined ? d : 1; };

function swap(a,b){
  let t=type[a]; type[a]=type[b]; type[b]=t;
  let f=fuel[a]; fuel[a]=fuel[b]; fuel[b]=f;
  let l=life[a]; life[a]=life[b]; life[b]=l;
  let h=temp[a]; temp[a]=temp[b]; temp[b]=h;
  let v=vel[a];  vel[a]=vel[b];   vel[b]=v;
  // A vent is a static solid and never moves, so this line should never do anything.
  // It is here because "should never" is how a cell ends up carrying somebody else's
  // payload the first time something does move one.
  let g=feed[a]; feed[a]=feed[b]; feed[b]=g;
  let d=way[a];  way[a]=way[b];   way[b]=d;
  let e=breath[a]; breath[a]=breath[b]; breath[b]=e;
}

/* What gets out of the way of something arriving from nowhere — a brush stroke, a vent's
   output. A gas and a liquid do; a powder or a solid does not, and that difference is what
   separates building inside a tank from cutting a hole in a wall.

   `denser` above is the other question and a different one: it is about a cell that is
   already in the box moving under gravity, so it weighs the two against each other. Nothing
   is falling here, so there is nothing to weigh.

   The brush and the vent both ask this, in one place, so they cannot drift apart. They had:
   a vent buried in water was plugged for everything except its own liquid, which only got
   out because a vent can push up through a column of its own making. Reported from the
   phone as "the vent only works for lava, molten and water while under any liquid". */
const yields = (t) => t === E || M[t].ph === 0 || M[t].ph === 1;

function denser(a,b){                  // can a displace b?
  if (b===E) return true;
  const pb = M[b].ph;
  if (pb===0) return true;             // anything pushes through gas
  if (pb!==1) return false;            // nothing pushes through a powder or a solid
  return densOf(a) > densOf(b);        // and through a liquid only if heavier than it
}

function moveFalling(){
  for (let y=H-2; y>=0; y--){
    const dir = Math.random()<.5 ? 1 : -1;
    for (let k=0; k<W; k++){
      const x = dir>0 ? k : W-1-k;
      const i = idx(x,y), t = type[i];
      if (t===E) continue;
      const m = M[t], ph = m.ph;
      if (ph!==1 && ph!==2) continue;

      // Drag comes from what is directly underneath, which is what makes a grain
      // slow the moment it reaches the surface of a pool rather than at some
      // arbitrary depth.
      const under = y<H-1 ? type[idx(x,y+1)] : STONE;
      const wet = M[under].ph === 1;
      vel[i] = (vel[i] + GRAVITY) * (wet ? DRAG_WET : DRAG_AIR);

      // Whole cells this tick, plus the fraction as a chance of one more. That is
      // the same thing as carrying a sub-cell offset around, without a second array
      // to keep in step — and it stops a poured stream moving in lockstep.
      const v = vel[i];
      let steps = Math.floor(v) + (Math.random() < v - Math.floor(v) ? 1 : 0);

      let ci = i, cx = x, cy = y, fell = 0;
      while (steps-- > 0){
        if (cy >= H-1){ vel[ci] = 0; break; }
        const d = idx(cx, cy+1);
        if (denser(t, type[d])){ swap(ci,d); ci = d; cy++; fell++; continue; }

        // Sliding off a heap is not falling, so it does not keep the speed — and a
        // rigid thing does not slide at all, it comes straight down.
        let slid = false;
        if (!m.rigid){
          const s = Math.random()<.5 ? 1 : -1;
          for (const dx of [s,-s]){
            if (!inb(cx+dx, cy+1)) continue;
            const dg = idx(cx+dx, cy+1);
            if (denser(t, type[dg])){ swap(ci,dg); ci = dg; cx += dx; cy++; fell++; slid = true; break; }
          }
        }
        if (slid) continue;
        vel[ci] = 0;                   // landed on something
        break;
      }

      /* A liquid hot enough to melt what is under it sinks into it, rather than
         sitting on top of the hole it has made.

         Without this, thermite was a spectacle and nothing else: it burns at 2538°C
         and the steel plate beneath came through completely untouched. The plate did
         melt — measured at 1469°C against a melting point of 1400 — but a liquid
         cannot displace a solid, so the melt had nowhere to go, and steel conducts
         better than anything else in the table, so the whole plate sat just under
         melting while the puddle on top froze back into the dent it had made.

         Self-limiting, and physically so: the front stops as soon as the liquid has
         given away enough heat to fall below the melting point of what it is eating,
         which is what gives a cut its depth. */
      if (ph===1 && cy<H-1){
        const b = idx(cx, cy+1), mb = M[type[b]];
        // Only into things that melt hot, and only with a clear margin over it. This
        // is a rule about cutting metal and rock; wax melts at 62°C and ice at 0, and
        // with either of them in scope a candle's pool burrowed straight down through
        // the candle and away from its own wick. The candle went from ~1150 ticks to
        // 453 with no margin, and 600 with a margin alone.
        /* Two ways down, and for a long time there was only one. Reported from the phone
           with pictures of the same charge on steel and on wood: through the steel in a
           clean plume, and on the wood just sitting there setting light to it and waiting.
           Molten iron at 2500°C does not wait for a wooden floor to burn — it goes through
           it. A liquid could sink into anything it could *melt* and nothing it could
           *burn*, and wood has no melting point, so it was outside the rule entirely. */
        const canMelt = mb.melt !== undefined && mb.melt >= MELT_HARD
                        && temp[ci] > mb.melt + MELT_THRU;
        const canBurn = mb.fuel > 0 && mb.ig < 9e9 && temp[ci] > mb.ig + BURN_THRU;
        if (mb.ph===3 && (canMelt || canBurn)){
          // What is left behind is what that material leaves when it burns, so a cut
          // through a log fills with embers rather than inventing anything.
          become(cx, cy+1, canMelt ? mb.into : (mb.ash !== undefined ? mb.ash : E));
          swap(ci, b);
          continue;
        }
      }

      // Lighter than the liquid it is sitting in: it comes up. Ice bobs, oil rises
      // through water and lies on top of it.
      if (fell===0 && cy>0){
        const u = idx(cx, cy-1);
        const mu = M[type[u]];
        if (mu.ph===1 && densOf(type[u]) > densOf(t)){ swap(ci,u); continue; }
      }

      // Liquids creep sideways, which is what makes oil a sheet rather than a column.
      // Only when there is something on top of them, though: a puddle already one
      // cell deep has nothing pushing it, and a film that keeps spreading is a film
      // that runs away from where you poured it. Measured with the old rule, a lit
      // oil trail retreated toward the flame as it burned — the far end drained back
      // into the cells the fire had just emptied — so the fire consumed 38 of 40
      // cells and the burning front never travelled past a third of the trail. The
      // wood at the end of it stayed at 53°C.
      //
      // "Something on top of it" turned out to be too strict once pools got big: the
      // surface layer of a pool has nothing above it either, so a body of water sat
      // in a dome instead of levelling off. Being part of a pool at all is the test —
      // liquid above OR liquid below. A one-deep film has neither and stays put.
      if (ph===1 && Math.random() < CREEP * (m.flow !== undefined ? m.flow : 1) &&
          ((cy>0 && type[idx(cx,cy-1)]===t) || (cy<H-1 && type[idx(cx,cy+1)]===t))){
        const s = Math.random()<.5 ? 1 : -1;
        for (const dx of [s,-s]){
          if (!inb(cx+dx,cy)) continue;
          const sd = idx(cx+dx,cy);
          if (type[sd]===E){ swap(ci,sd); break; }
        }
      }
    }
  }
}

const GAS_DRIFT = .25;   /* how readily a gas that cannot rise goes sideways instead.

                            Without it a gas only ever moves up or diagonally up, so any
                            pocket it cannot reach from below stays empty forever — and a
                            creature standing on a floor makes its own pocket, because the
                            gas above it rises away and the creature's body blocks anything
                            refilling from underneath. Measured: a worm walking a floor in a
                            box 76% full of gas had empty cells on its left, its right and
                            above it, at every sample across fifteen seconds, and its breath
                            never left zero. Gas killed the moths and nothing else, which is
                            how it was reported.

                            A quarter rather than always, so it stays a drift: a gas is still
                            a thing that goes up, and the sideways move only ever happens
                            when up is closed. */
function moveRising(){
  for (let y=1; y<H; y++){
    for (let x=0; x<W; x++){
      const i = idx(x,y), t = type[i];
      if (t===E || M[t].ph!==0) continue;
      const u = idx(x,y-1);
      if (type[u]===E){ swap(i,u); continue; }
      const s = Math.random()<.5 ? 1 : -1;
      let rose = false;
      for (const dx of [s,-s]){
        if (!inb(x+dx,y-1)) continue;
        const ud = idx(x+dx,y-1);
        if (type[ud]===E){ swap(i,ud); rose = true; break; }
      }
      // Nowhere up to go: spread out instead, which is what fills a pocket under a shelf
      // or beside anything standing on the floor.
      if (!rose && Math.random() < GAS_DRIFT){
        for (const dx of [s,-s]){
          if (!inb(x+dx,y)) continue;
          const sd = idx(x+dx,y);
          if (type[sd]===E){ swap(i,sd); break; }
        }
      }
    }
  }
}

/* ============================================================ heat
   Conduction, as a trade between neighbours rather than an average.

   Each pair of touching cells is visited exactly once — every cell trades with the
   one to its right and the one below, which covers every pair on the grid — and the
   energy that leaves one is precisely the energy that arrives in the other. That is
   the whole reason for the shape of this loop, and `test/matchbox-sim.mjs` asserts
   it: 300 ticks of diffusion over a lumpy field of wood, steel, water and stone must
   not change the total heat in the box.

   The model this replaced averaged each cell against its four neighbours and scaled
   the result by that cell's own conductivity over its own capacity. Read quickly it
   looks like the same thing. It isn't: A gave heat away at a rate set by A, and B
   took it at a rate set by B, so every boundary between two different materials was
   quietly manufacturing or destroying energy — worst at exactly the interesting
   places, like steel against air, where the two rates differ by nearly 3×.

   Two conductances in contact add in series, which is the harmonic mean below. It is
   also what stops a good conductor touching a bad one from behaving like two good
   ones: steel carries heat along a bar and still hands it over slowly to the wood at
   the end of it. */

function diffuse(){ conduct(); convect(); roomLoss(); }

function conduct(){
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const i = idx(x,y);
      const ma = M[type[i]];
      const ca = ma.cond !== undefined ? ma.cond : AIR_COND;
      const pa = ma.cap  !== undefined ? ma.cap  : AIR_CAP;

      // right neighbour, then the one below: every pair, exactly once
      for (let d=0; d<2; d++){
        const j = d ? i+W : i+1;
        if (d ? y===H-1 : x===W-1) continue;
        const mb = M[type[j]];
        const cb = mb.cond !== undefined ? mb.cond : AIR_COND;
        const pb = mb.cap  !== undefined ? mb.cap  : AIR_CAP;
        // FLOW is bounded by the worst pair on the board — steel against steel, where
        // k·(1/cap + 1/cap) is 1.15 — times the four pairs a cell belongs to. Above
        // about .21 that cell overshoots its neighbours and the field starts to ring.
        const q = (temp[i] - temp[j]) * (2*ca*cb/(ca+cb)) * FLOW;
        temp[i] -= q / pa;
        temp[j] += q / pb;
      }
    }
  }
}

// Convection, and only in the gas. Hot air rises and takes its heat with it; a hot
// log does not. The old model applied this lift to any cell with gas above it, which
// meant every burning solid was venting 7% of its heat upward every tick. (Measured:
// removing that alone fixed none of the failures, but it is still wrong, and it made
// the rest of the model impossible to reason about.)
function convect(){
  for (let y=1; y<H; y++){
    for (let x=0; x<W; x++){
      const i = idx(x,y);
      if (!gassy(type[i]) || temp[i] <= AMBIENT + 40) continue;
      if (!gassy(type[i-W])) continue;
      // Never past the cell it is rising into. Buoyancy carries heat up a gradient;
      // it does not pump against one. Unbounded, this was the leak that put the
      // hottest cell of a lava scene at 3774°C against a stated ceiling of 1650:
      // every gas cell handed 9% of its excess to the one above, so a column of hot
      // air concentrated at the top with nothing to stop it. Measured at up to
      // +130°C a tick, on its own, with conduction and reaction adding nothing.
      const lift = Math.min((temp[i] - AMBIENT) * .09,
                            Math.max(0, (temp[i] - temp[i-W]) * .5));
      temp[i] -= lift; temp[i-W] += lift;
    }
  }
}

// The room. Only the air is in touch with it — a stone floor loses its heat by
// conducting into the air above it, which conduct() already does. Applying this to
// every cell made a thick wall into a heat sink that no fire could ever warm.
function roomLoss(){
  for (let i=0; i<temp.length; i++){
    if (gassy(type[i])) temp[i] += (AMBIENT - temp[i]) * ROOM_LOSS;
    // The ceiling, enforced in one place. "Nothing gets hotter than MAX_T" is a
    // claim the file makes, and it was being trusted to five separate clamps
