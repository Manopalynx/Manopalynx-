<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the board can sit under the notch and the action bar
     can pad itself past the home indicator -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08090D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grandiose">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Grandiose — The Ledger</title>
<style>
/* System fonts only. A webfont would need the network, and this has to work on
   a train with no signal once it is on the home screen. */
:root{
  --void:#08090D;--deep:#0F1118;--panel:#161A24;--rule:#242938;
  --dim:#6B7386;--body:#B6BCCB;--bright:#F2F4F9;
  --gold:#D9A441;--tx:#5ECFC8;--warn:#E0776A;--vio:#8B7DD8;
  --syn:#7A6A5C;--eni:#6FA8A3;--dom:#9B6B8E;--eden:#D98E45;
  --ven:#C25E52;--com:#C9A227;--bas:#4E8C5A;--agora:#4F6FA8;
  --fleet:#8892A6;--util:#6B7C93;
  --m:ui-monospace,'SF Mono',Menlo,monospace;
  --s:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html{height:100%}
body{margin:0;height:100dvh;overflow:hidden;background:var(--void);color:var(--body);
  font-family:var(--s);font-weight:400;overscroll-behavior:none;
  font-size:16px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--m);color:var(--bright);margin:0;font-weight:600}
button{font-family:var(--m);cursor:pointer;border-radius:6px;border:1px solid var(--rule);
  background:transparent;color:var(--body);font-size:14px}
button:disabled{opacity:.28}
.hidden{display:none!important}

/* ---------------------------------------------------------------- setup */
#setup{height:100dvh;overflow-y:auto;padding:calc(var(--safe-t) + 28px) 20px calc(var(--safe-b) + 32px);
  -webkit-overflow-scrolling:touch}
#setup h1{font-size:34px;letter-spacing:-.02em;line-height:1;font-weight:800}
#setup h1 em{display:block;font-style:normal;font-size:12px;font-weight:500;
  color:var(--gold);letter-spacing:.34em;margin-top:10px}
.quote{border-left:2px solid var(--gold);padding:4px 0 4px 14px;margin:24px 0;
  font-style:italic;font-size:15px;line-height:1.6}
.quote b{display:block;font-style:normal;font-family:var(--m);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:10px;font-weight:400}
.fld{margin:24px 0}
.fld label{display:block;font-family:var(--m);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1 1 0;min-width:70px;min-height:48px;background:var(--panel);color:var(--dim);
  padding:12px 8px;font-size:14px}
.opt.on{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.10)}
input[type=text],input[type=number]{width:100%;background:var(--deep);color:var(--bright);
  border:1px solid var(--rule);border-radius:6px;padding:14px;font-family:var(--m);
  font-size:17px;margin-bottom:10px}
.big{width:100%;min-height:56px;border-color:var(--gold);color:var(--gold);
  font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-top:14px}
.aiCard{display:flex;gap:12px;align-items:flex-start;background:var(--panel);
  border:1px solid var(--rule);border-left-width:3px;border-radius:6px;padding:14px;margin-bottom:8px}
.aiCard .n{font-family:var(--m);font-size:15px;color:var(--bright)}
.aiCard .d{font-size:14px;color:var(--dim);line-height:1.45;margin-top:4px}
.note{font-size:13px;color:var(--dim);line-height:1.6;margin-top:22px}

/* ---------------------------------------------------------------- shell */
#game{display:flex;flex-direction:column;height:100dvh;padding-top:var(--safe-t)}

/* Four chips share the width rather than scrolling, because a player whose
   money is off the edge of the screen may as well not be at the table. */
.bar{flex:0 0 auto;display:flex;gap:5px;padding:7px 8px;
  border-bottom:1px solid var(--rule)}
/* A button now, not a div: tapping one opens what that player holds. The chips
   read as inert panels, so the affordance is the holdings count and a chevron
   in the corner — a number you want anyway, which happens to say "there is more
   here". text-align:left because a button centres its content by default and
   would have re-laid out the whole bar. */
/* 6px of side padding, not 8. Four chips share 393pt with a menu button, which
   leaves about 69px inside each one — and "Spector" is 50.6px at 12px in this
   monospace. Every pixel here is a character of somebody's name. */
.pchip{flex:1 1 0;min-width:0;background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;padding:4px 6px;font-family:var(--m);overflow:hidden;
  text-align:left;display:block;color:inherit;-webkit-tap-highlight-color:transparent}
.pchip:active{background:rgba(255,255,255,.05)}
/* The count sits on the CASH line, not the name line. It began in the top-right
   corner with 22px of padding reserved on the name row to clear it, which took
   the name from 51.8px to 29.8px and truncated "Varan" — a name that had always
   fitted. The cash line has room it will never use: measured over 25 full games,
   31,536 readings, the largest balance seen was ₡6,085 and not one reading
   reached five figures. The cash does not shrink, so if one ever did the badge
   is what gets clipped rather than the money. */
.pchip .cashRow{display:flex;align-items:baseline;gap:3px;min-width:0}
.pchip .chipMore{flex:0 0 auto;margin-left:auto;font-size:9px;color:var(--dim);
  display:flex;align-items:center;gap:1px;line-height:1;pointer-events:none}
.pchip .chipMore .chev{font-size:11px;position:relative;top:-.5px}
.pchip.act .chipMore{color:var(--gold)}
.pchip.act{border-color:var(--gold);background:rgba(217,164,65,.10)}
.pchip .nm{color:var(--bright);font-size:12px;display:flex;align-items:center;gap:4px;
  white-space:nowrap;min-width:0}   /* 4px, not 5: "Spector" missed by 0.3px on a 375pt screen */
.pchip .nm .who{overflow:hidden;text-overflow:ellipsis}
.pchip .cash{flex:0 0 auto;color:var(--tx);font-size:13.5px;margin-top:1px;white-space:nowrap}
.pip{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.menuBtn{flex:0 0 auto;width:34px;min-height:46px;font-size:15px;color:var(--dim);
  background:var(--panel);display:flex;align-items:center;justify-content:center}
/* The chip's status line is ALWAYS rendered, empty or not, so the chip cannot
   change height when somebody takes a marker or enters vassalage — see
   renderBar. Its line-height is stated rather than inherited, because the
   reserve costs 16px at the browser default and the shortest phone had only 7px
   of slack; overflow:hidden on the chip does the rest. */
.vs{color:var(--vio);font-size:10px;line-height:1.2;letter-spacing:.03em;white-space:nowrap}

/* Holdings grouped by set in the player sheet. */
.pgHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:var(--m);font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  margin:14px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--rule)}
.pgHead .pgCount{color:var(--dim);font-size:11px;letter-spacing:.02em;text-transform:none}
/* What a garrison and a citadel cost on this set, and what each sells back for.
   Set-level constants, so they belong on the heading and not repeated per row --
   and its height never changes, so it cannot move a row under a thumb. */
.pgCost{display:flex;justify-content:space-between;gap:10px;font-family:var(--m);
  font-size:11px;color:var(--dim);padding:0 2px 6px;letter-spacing:.01em}
.pgRow{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:14px}
.pgRow .pgName{flex:1 1 auto;color:var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pgRow .pgState{flex:0 0 auto;color:var(--dim);font-size:11px;font-family:var(--m)}
.pgRow .pgRent{flex:0 0 auto;color:var(--tx);font-family:var(--m);font-size:13px;
  min-width:56px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- board */
/* 11 tracks: a deep corner, nine shallow squares, a deep corner — so the edge
   cells face inwards the way a real board's do, and the middle is larger.
   40 squares round a 393pt perimeter is ~31px a side whatever shape they are,
   which is why they carry codes rather than names. */
/* Two independent ways this board stopped being square when a 15px mark was
   added above the code, both closed here.
   min-height:0 — .board is a flex item in a column, where the automatic minimum
   height resolves to its content and silently outranks aspect-ratio. That is
   what actually pinned the board at 497px tall in a 375px-wide viewport.
   minmax(0,…) — a bare fr track is minmax(AUTO,1fr), so each track floors at its
   own content and is a second route to the same place.
   Neither failure is visible as a failure: the board still renders, still plays,
   and simply pushes the page into a 117px scroll. The probe asserts squareness,
   which is the only reason it was caught. */
.board{flex:0 0 auto;min-height:0;display:grid;
  grid-template-columns:minmax(0,1.55fr) repeat(9,minmax(0,1fr)) minmax(0,1.55fr);
  grid-template-rows:minmax(0,1.55fr) repeat(9,minmax(0,1fr)) minmax(0,1.55fr);
  gap:1.5px;aspect-ratio:1;width:100%;padding:5px}
/* A flat fill made the board read as a spreadsheet. The gradient and the hair
   of light along the top edge cost nothing and give each square a face. */
.cell{position:relative;border:1px solid var(--rule);border-radius:4px;
  background:linear-gradient(168deg,#171B26 0%,#0E1017 62%,#0B0D13 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  padding:2px;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}
/* The colour band sits on the INWARD edge of each side, as on a real board, so
   the four rows of colour face the middle. Absolutely placed rather than laid
   out, so the text below it is unaffected by which edge the cell is on. */
.cell .cbar{position:absolute;border-radius:1px;z-index:1}
.cell.e-bottom .cbar{top:0;left:0;right:0;height:5px}
.cell.e-top    .cbar{bottom:0;left:0;right:0;height:5px}
.cell.e-left   .cbar{right:0;top:0;bottom:0;width:5px}
.cell.e-right  .cbar{left:0;top:0;bottom:0;width:5px}
.cell.e-bottom{padding-top:7px}
.cell.e-top{padding-bottom:7px}
.cell.e-left{padding-right:7px}
.cell.e-right{padding-left:7px}
/* 10px, not the 6.4px the first build used. 28 squares in an 8x8 grid on a
   393pt screen leaves 45px cells, so the full name cannot fit and does not try:
   the cell carries a code, and the centre panel names the square in full. */
.cell .code{font-family:var(--m);font-size:10px;line-height:1.1;color:var(--body);
  margin-top:1px;letter-spacing:-.06em}
.cell /* The figure on a square. Dim while it is a price nobody has paid; once owned
   it is what landing there costs, and it brightens so the two cannot be read as
   the same kind of number. See cellFigure in ui.js. */
.cpr{font-family:var(--m);font-size:8px;color:var(--dim);margin-top:auto;
  white-space:nowrap;overflow:hidden;text-overflow:clip}
.cpr.rent{color:var(--tx);font-weight:600}
/* The eighteen non-property squares carry a drawn mark.
   ABSOLUTELY placed, and that is the whole design. A mark stacked above the
   code was measured and does not fit: a left- or right-edge cell is 30.4px tall
   on a 393pt screen, and once border, padding and the 7px inward edge are taken
   there are 17px left — against 15px of icon plus 11px of code. Worse, it did
   not overflow, it grew the grid: the board went from square to 375x497 and the
   page picked up a 117px scroll.
   Out of flow it cannot push a track no matter what size it is drawn at, so the
   mark reads at cell scale on the deep corners and the shallow edges alike, and
   the code keeps the whole line to itself on top. */
.cell .cico{position:absolute;inset:0;margin:auto;width:62%;height:62%;
  max-width:30px;max-height:30px;color:var(--dim);opacity:.32;z-index:0;pointer-events:none}
/* Go, Detention, the Anchorage and Absorbed are the landmarks and have the room. */
.cell.corner .cico{width:54%;height:54%;color:var(--gold);opacity:.42}
/* Above the mark, and above the colour bar's z-index:1 on fleets and utilities. */
.cell .code,.cell .cpr{position:relative;z-index:2}
.cell.e-left .code,.cell.e-right .code,.cell.corner .code{margin-top:0}
/* Corners are landmarks — Go, the Facility, Absorbed, the Anchorage. They were
   indistinguishable from an ordinary square apart from the label colour. */
.cell.corner{background:radial-gradient(120% 120% at 50% 0%,#20242F 0%,#12141C 58%,#0C0E14 100%);
  border-color:#31374A}
.cell.corner .code{color:var(--gold);letter-spacing:.06em}
.cell.owned{box-shadow:inset 0 0 0 2px currentColor}
/* A pledged square is dead. It earns no rent, it cannot be built on, and it
   does not count toward its set — but on the board it was a working square with
   a ⌀ eight pixels across in one corner, which is the same amount of ink a
   single garrison gets and says nothing about what it means.
   Hatched in the owner's own colour, so it still reads as theirs while reading
   as encumbered. At z-index 1 it paints over the colour bar and the mark but
   UNDER the code, which stays at 2 — the square must still be identifiable at
   a glance, and legibility of the four-character code is the whole reason the
   cell is laid out the way it is. */
.cell.pledged::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(135deg,
    transparent 0 3.5px,currentColor 3.5px 4.6px);opacity:.26}
.cell.pledged .code{color:var(--dim)}
.cell.pledged .cpr{text-decoration:line-through;text-decoration-thickness:1px}
/* Above the hatch. The pieces are the one thing on a cell that must never be
   ambiguous — a player has to see which square they are standing on. */
.cell .toks{position:absolute;bottom:2px;right:2px;display:flex;gap:2px;z-index:3;
  flex-wrap:wrap-reverse;max-width:72%;justify-content:flex-end}
.tok{width:7px;height:7px;border-radius:50%;border:1px solid rgba(0,0,0,.6)}
.tok.me{width:9px;height:9px;box-shadow:0 0 0 1.5px var(--void),0 0 8px 1px currentColor}
/* The development mark — garrisons, a citadel, or the pledged ring.
   z-index above the colour bar, and moved clear of it on the left edge. The bar
   sits on the INWARD side of each cell, which on a left-edge cell is the right,
   which is exactly where this mark was: measured at 83% covered on every one of
   indices 11-19, with the bar at z-index 1 and this at auto. A whole column of
   the board showed no citadels, no garrisons and no pledges at all, and nothing
   about that failed — the state was simply invisible on a ninth of the squares.
   Reported from play as "I have a citadel on Ortox Transit and cannot see it". */
.cell .grr{position:absolute;top:6px;right:1px;font-family:var(--m);font-size:8px;
  color:var(--gold);z-index:2}
.cell.e-left .grr{right:7px}
/* The moving piece's own colour, set inline per cell — not a fixed accent.
   This was var(--gold), which is #D9A441, which is byte-identical to PIPS[0],
   which is the first seat's pip. So whoever was moving, the square they stepped
   through and the one they landed on was outlined in player one's colour. All
   four pips ARE the four theme accents, so any fixed colour here collides with
   somebody; taking it from the player makes it right by construction. Same
   defect the README records for the selection ring, which was Spector's teal. */
.cell.here{outline:2px solid var(--here,var(--gold));outline-offset:-2px;z-index:4}
/* Dashed and in a colour NO player can be dealt. It used to be var(--tx), which
   is exactly Spector's #5ECFC8, so the square you last tapped was indis-
   tinguishable from a square Spector owned — ownership draws a 2px inset ring
   in the owner's colour. Held by "the selection ring cannot be mistaken for a
   player" in test/engine.test.mjs. */
.cell.sel{outline:2px dashed var(--bright);outline-offset:-3px;z-index:5}

.mid{grid-column:2/11;grid-row:2/11;position:relative;background:#05060A;
  border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.galaxyCanvas{position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0}
.midInner{position:relative;z-index:1;height:100%;padding:10px;display:flex;
  flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;
  /* the disc is behind live text, so the text needs its own footing */
  text-shadow:0 1px 6px rgba(3,4,8,.95),0 0 18px rgba(3,4,8,.8)}
.mid .who{font-family:var(--m);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold)}
.mid .dice{display:flex;gap:8px}
.die{width:34px;height:34px;border:1px solid var(--rule);border-radius:6px;
  background:linear-gradient(160deg,#1F2430,#12151D);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;font-family:var(--m);
  font-size:17px;color:var(--bright)}
.mid.rolling .die{animation:tumble .1s linear infinite;border-color:var(--gold)}
@keyframes tumble{
  0%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-3px) rotate(-7deg)}
  75%{transform:translateY(2px) rotate(6deg)}
  100%{transform:translateY(0) rotate(0)}}
.mid .msg{font-size:14px;line-height:1.4;color:var(--body);max-height:76px;overflow:auto;
  padding:0 4px}
.mid .sq{font-size:15px;color:var(--bright);font-family:var(--m)}
.mid .meta{font-family:var(--m);font-size:9px;letter-spacing:.02em;color:var(--dim);
  white-space:nowrap}
.sndBtn{font-size:10px;letter-spacing:.12em;padding:6px 14px;min-height:32px}

/* ---------------------------------------------------------------- actions */
.acts{flex:0 1 auto;display:grid;grid-template-columns:repeat(3,1fr);
  grid-auto-rows:minmax(52px,68px);gap:6px;padding:6px 8px}
.act{min-height:52px;padding:8px 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.act.pri{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.08)}
.act small{font-size:9.5px;color:var(--dim);letter-spacing:.02em;text-transform:none;
  font-family:var(--s)}

/* ---------------------------------------------------------------- log */
/* The ledger is shut by default and shows its most recent entry. Open it and it
   takes the rest of the screen; shut, it gives that back to the board. */
/* overflow:hidden because the ledger's own box can spill past the wrapper on
   the shortest phone -- .log carries a bottom padding of its own and scrolls
   internally, so clipping here costs nothing and stops 8px of the document
   growing past the viewport. Found when the chip row reserved a status line
   and the page began scrolling by exactly that spill. */
.logWrap{flex:0 0 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  /* Shut, it sits on the bottom edge like a status line and the slack falls
     above it, rather than leaving a hole under the buttons. */
  margin-top:auto;border-top:1px solid var(--rule)}
.logWrap.open{flex:1 1 auto;margin-top:0}
.logHead{width:100%;min-height:46px;border:none;border-radius:0;background:transparent;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 12px;text-align:left;font-family:var(--s);font-size:13.5px;color:var(--body)}
.logHead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.logHead b{font-family:var(--m);font-size:11px;color:var(--dim);flex:0 0 auto;
  letter-spacing:.06em}
.log{display:none;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-top:1px solid var(--rule);padding:8px 12px calc(var(--safe-b) + 10px);
  font-size:14px;line-height:1.5}
.logWrap.open .log{display:block}
.le{padding:6px 0;border-bottom:1px solid rgba(36,41,56,.55)}
.le:last-child{border:none}
.le .t{font-family:var(--m);font-size:10px;color:var(--dim);letter-spacing:.08em}
.le.leader{border-left:2px solid var(--gold);padding-left:10px;font-style:italic}
.le.voice b{font-family:var(--m);font-size:12px;font-style:normal}

/* ---------------------------------------------------------------- sheets */
/* Bottom sheets rather than centred boxes: a thumb reaches the bottom of a
   6.1" phone and does not comfortably reach the middle. */
.scrim{position:fixed;inset:0;background:rgba(4,5,8,.72);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--panel);border:1px solid var(--rule);border-bottom:none;
  border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:8px 18px calc(var(--safe-b) + 18px);
  animation:rise .2s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(22px)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:6px auto 14px}
.sheet h3{font-size:18px;margin-bottom:4px}
.sheet .sub{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin-bottom:16px}
.stat{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--rule);font-family:var(--m);font-size:14px}
.stat span:first-child{color:var(--dim)}
.stat span:last-child{color:var(--bright);text-align:right}
.mbtns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.mbtn{flex:1 1 44%;min-height:52px;padding:14px 10px;font-size:13px;letter-spacing:.05em;
  text-transform:uppercase}
.mbtn.pri{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.08)}
.mbtn.dgr{border-color:var(--warn);color:var(--warn)}
/* An armed button says what it is about to do, in the colour of a warning. */
.mbtn.armed,.act.armed{border-color:var(--warn);color:var(--warn);
  background:rgba(224,119,106,.12);font-size:11.5px}
.mbtn.wide{flex:1 1 100%}
.card{border-left:3px solid var(--gold);padding:14px 16px;background:var(--deep);
  border-radius:0 8px 8px 0;font-size:16px;line-height:1.5;margin:12px 0}
.card em{color:var(--gold);font-style:italic}
/* The author's own words, told apart from lines written for the game. Same
   distinction the square panel already draws with .flav.quoted. */
.card.quoted{font-style:italic;color:var(--tx)}
.card .attrib{display:block;margin-top:8px;font-family:var(--m);font-size:10px;
  letter-spacing:.06em;color:var(--dim);font-style:normal}
/* What the card does, in plain terms, under the words it is dressed in.
   Indented to 19px to sit under the card's text rather than its gold rule
   (3px border + 16px padding). The longest card in either deck leaves 18px
   clear above the fold on a 667px iPhone SE — the probe measures it. */
.effect{font-family:var(--m);font-size:13.5px;line-height:1.6;color:var(--dim);
  margin:-4px 0 12px;padding-left:19px}
.effect div{padding:2px 0}
.effect div:first-child{color:var(--tx)}
/* The deck reference. Effect first and in the reading colour, flavour under it
   in the dim one — the opposite weighting to a drawn card, because here the
   player is looking up what a deck holds rather than savouring one of them. */
/* A square's line. The author's own words are set in italic against the gold
   rule; anything written for the game sits plain, so the difference is legible
   without opening data.js. */
/* The circuit counter, once the deep array has contacts. */
.meta.near{color:var(--warn)}
/* A set's colour, inline in a stat row, so a trade shows what it is made of. */
/* An indented sub-row under a set, for each side's holding count. */
.stat.sub2{padding-left:19px;font-size:13px;color:var(--dim)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;
  vertical-align:baseline;margin-right:6px}
.warnbox.ok{background:rgba(94,207,200,.12);border-color:rgba(94,207,200,.4);color:var(--tx)}
.flav{font-size:14px;line-height:1.5;color:var(--dim);margin:10px 0 14px}
.flav.quoted{font-style:italic;color:var(--tx);border-left:2px solid var(--gold);padding-left:11px}
.deckrow{padding:9px 0;border-bottom:1px solid var(--rule)}
.deckrow:last-child{border-bottom:0}
.deckwhat{font-family:var(--m);font-size:13px;color:var(--tx)}
.decksays{font-size:13.5px;line-height:1.45;color:var(--dim);margin-top:3px}
.decksays em{color:var(--gold);font-style:italic}
.bars{height:9px;background:var(--rule);border-radius:5px;overflow:hidden;margin-top:8px}
.bars i{display:block;height:100%;background:var(--vio)}
table{width:100%;border-collapse:collapse;font-family:var(--m);font-size:13px;margin-top:10px}
td,th{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:right}
th{color:var(--dim);font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid var(--rule);padding:11px 0}
/* Reserved so the control block does not slide sideways as buttons appear
   and disappear between builds. */
/* One line, always. This carries the holding's state and now the price of the
   next garrison, and the string changes length as you build — "0 garrisons" is
   wider than "1 garrison". Left free to wrap it reflowed to two lines and back,
   changing the row height by 4px and walking the list out from under the thumb
   on every purchase. Height is pinned rather than merely nowrap so no future
   content can reintroduce it. */
.rowMain{min-width:0;flex:1 1 auto}
.rowName{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.rowState{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--m);font-size:11.5px;color:var(--dim);
  line-height:16px;height:16px;margin-top:2px}
.rowbtns{display:flex;gap:6px;flex:0 0 auto;justify-content:flex-end;min-width:124px}
.rowbtns button{min-height:44px;min-width:52px;padding:8px 10px;font-size:12px}
.pick{display:block;width:100%;text-align:left;padding:12px;margin-bottom:6px;font-size:14px;
  font-family:var(--s);min-height:52px}
.pick.on{border-color:var(--gold);color:var(--gold)}
.pick .why{display:block;font-size:11.5px;color:var(--warn);margin-top:3px}
.pick .sub2{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.tradeSum{margin-top:14px;padding:10px 12px;background:var(--deep);border:1px solid var(--rule);
  border-radius:8px;font-family:var(--m);font-size:13px}
.sumRow{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.sumRow span:first-child{color:var(--dim)}
.sumRow span:last-child{color:var(--bright)}
.sumFlag{font-family:var(--s);font-size:12.5px;color:var(--gold);margin-top:6px}
.sumFlag.warn{color:var(--warn)}
.warnbox{background:rgba(224,119,106,.10);border:1px solid var(--warn);border-radius:8px;
  padding:12px;font-size:13.5px;line-height:1.5;color:var(--body);margin:12px 0}
/* ---------------------------------------------------------------- landscape */
/* Turned sideways, the board is bound by HEIGHT rather than width, so it does
   not get any bigger — but the ~250pt of slack that had nowhere to go in
   portrait becomes a column beside it that holds everything else properly. */
@media (orientation:landscape) and (max-height:560px){
  #game{
    display:grid;
    grid-template-columns:min(calc(100dvh - var(--safe-t) - var(--safe-b)), 62%) 1fr;
    grid-template-rows:auto auto 1fr;
    grid-template-areas:"board bar" "board acts" "board log";
    column-gap:6px;
    padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  }
  .board{grid-area:board;align-self:center;width:100%;padding:4px}
  .bar{grid-area:bar;border-bottom:none;padding:6px 6px 0 0}
  .acts{grid-area:acts;padding:6px 6px 0 0;grid-auto-rows:minmax(48px,60px)}
  .logWrap{grid-area:log;margin-top:0;min-height:0;border-top:1px solid var(--rule);
    margin-right:6px}
  .logWrap .log{display:block}          /* the column exists to hold it */
  .logHead{display:none}                /* and there is no slack to reclaim */
  .log{padding-bottom:8px}
  .sheet{max-height:94dvh}
  .pchip{padding:5px 7px}
  .pchip .cash{font-size:12.5px}
  .act{min-height:48px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="setup"></div>
<div id="game" class="hidden">
  <div class="bar" id="bar"></div>
  <div class="board" id="board"></div>
  <div class="acts" id="acts"></div>
  <div class="logWrap" id="logWrap">
    <div class="logHead" id="logHead"></div>
    <div class="log" id="log"></div>
  </div>
</div>
<div id="sheetRoot"></div>

<script type="module" src="./ui.js"></script>
<script>
// Registered from the page rather than the module so a failure here can never
// stop the game loading. Offline support is a convenience; the game is not.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
