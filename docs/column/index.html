<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./column.webmanifest">
<link rel="apple-touch-icon" href="./column-icon-180.png">
<title>Grandiose — The Column</title>
<style>
:root{
  --bg:#0b1017; --panel:#0f141b; --edge:#222c38; --ink:#e7eef7; --dim:#7f8fa2;
  --blue:#6fc6f5; --blueFill:#1b3a52; --blueInk:#dff1ff;
  --amber:#f2955c; --amberFill:#4a2418; --amberInk:#ffe6d6;
  --card:#f2e2c4; --cardIn:#dcc9a6; --cardInk:#3a2f1e;
  --up:#cde9c2; --upIn:#b3d6a4; --heart:#e05a6a; --heartOff:#3a2630;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------------------------------------------------------------- the bar */
#bar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:linear-gradient(#171f29,#0f141b);border-bottom:1px solid var(--edge)}
.hearts{font-size:17px;letter-spacing:2px;color:var(--heart)}
.hearts.r{text-align:right}
.hearts .off{color:var(--heartOff)}
#who{font-size:10.5px;letter-spacing:1.4px;color:var(--dim);text-align:center;text-transform:uppercase;
  padding:9px 10px;margin:-9px -10px;cursor:pointer}
#who:active{color:var(--ink)}

/* -------------------------------------------------------------- the field */
#fieldWrap{flex:1 1 auto;position:relative;min-height:0;background:#0e1620}
#field{position:absolute;inset:0;width:100%;height:100%;display:block}
/* THE DECORATION MUST NOT EAT A TAP. An aura is drawn 18 field units across --
   wider than the counter at its centre and wider than several of its neighbours
   -- and shots, splashes and detonations are painted over the field too. Neither
   layer sits inside a `g[data-id]`, so a tap landing on one found no counter and
   CLEARED the inspection instead of opening it: near a Volt Battery, a thumb that
   missed the marker by a millimetre closed the panel it was reaching for. Nothing
   threw and nothing looked wrong -- the panel simply did not appear. Found by a
   check that could not click a Volt Battery -- and the aura was only the first
   interceptor it found; the ground paints a half-field tint with no class on it
   at all. So the whole field is transparent to a tap by default and only what is
   INSIDE a counter takes one. The handler already reads `closest('g[data-id]')`,
   so hitting a counter's shape or its glyph resolves to the same counter. */
#field *{pointer-events:none}
#field g[data-id] *{pointer-events:auto}
#toast{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none;
  font-size:12.5px;letter-spacing:.6px;color:var(--ink);text-shadow:0 1px 3px #000;
  opacity:0;transition:opacity .25s}
/* Tapping a marker answers OVER the field, not in the deck. A four-line answer
   in a fixed-height status line either clips or resizes the deck, and resizing
   the deck moves the whole battlefield. */
#info{position:absolute;left:10px;right:10px;bottom:10px;background:#131b25f2;
  border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:12px;
  color:#b8c6d6;line-height:1.4;display:none}
#info.on{display:block}
#info b{color:var(--ink)}
#info q{display:block;color:#93a3b5;margin-top:4px;font-size:11.5px}
/* WHAT A TAG MEANS -- his note 11. One line a mechanism, the name in front of it,
   and every number in the sentence read from the same field the resolver reads. */
.abs{margin-top:5px}
.ab{display:block;font-size:11px;line-height:1.35;color:#9fb0c2;margin-top:2px}
.ab b{color:var(--ink);font-weight:600}
/* A newly committed card lands rather than appears. Sam's note 5: the reveal is
   the feedback, so it has to be visible without being waited on. */
@keyframes pop{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:.95}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1) both;transform-box:fill-box;transform-origin:center}
#toast.on{opacity:1}

/* --------------------------------------------------------------- the deck */
#deck{flex:0 0 auto;background:linear-gradient(#0f141b,#171f29);border-top:1px solid var(--edge);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
/* YOUR hearts live down here with your cards and your half of the field; theirs
   stay in the top bar with their half. Sam's note 3 — the game should sit on
   your side of the screen. */
/* Fixed, like the row below it. "Your extra pick — you lost the round" wrapped
   to two lines and moved the battlefield twenty-two pixels; the reason for a
   pick belongs in the line under it, which has room for two lines already. */
#head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;height:22px;overflow:hidden}
#head .hearts{font-size:15px;letter-spacing:1.5px}
#head .right{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
/* The purse. Empty when it is empty, because a nought is a thing to read and
   nothing is not.
   NO CURRENCY MARK HERE. This carried `content:'\00A4 '` -- a generic currency
   sign, added when the market shipped and `#cash` held a bare number. `COIN`
   arrived a session later and `coin()` has prepended a real credit sign ever
   since, so the deck read "¤ ₡13" with two marks on one figure. A symbol written
   twice, and the second copy was in the stylesheet where nobody reading the
   interface would look for it. */
#cash{font-size:12px;color:#e8c877;font-weight:600}
/* `.pick.shopRow`, not `.shopRow`. This was one class against `.pick`'s
   `display:block` FORTY LINES LATER in the same stylesheet -- equal specificity,
   so the later rule won and this one has never applied since the day the market
   shipped. The counter has been sitting above the name rather than beside it,
   and `svg{flex:0 0 34px}` and `span{min-width:0}` below have been inert with
   it. Nothing threw and nothing looked obviously wrong; it took putting the
   abilities in the row and then looking at the screenshot. */
.pick.shopRow{display:flex;align-items:center;gap:11px}
/* A row carrying its abilities is several lines tall, so the counter sits at the
   top of it rather than floating in the middle of the text. */
.pick.shopRow.tall{align-items:flex-start}
.pick.shopRow.tall svg{margin-top:3px}
/* Out of reach, and still on the shelf -- Sam's note 14. The price is the point,
   so it is the price that stays lit while the row goes quiet. */
.pick.cant{opacity:.5}
.pick.cant .far{color:#e8c877;opacity:.9;font-weight:600}
.pick.shopRow svg{flex:0 0 34px}
.pick.shopRow span{min-width:0}
#prompt{font-size:12px;color:var(--ink);font-weight:600;margin-bottom:2px}
/* FIXED HEIGHTS, ALL THREE. The deck is a flex sibling of the field, so every
   pixel it gains or loses moves the battlefield -- which is exactly what Sam
   saw: pick a card and the whole board jumped. The card row keeps its box when
   empty, the status line keeps two lines whatever it says, and the button keeps
   its space when there is nothing to press. */
#sub{font-size:11px;color:var(--dim);margin-bottom:8px;height:31px;overflow:hidden}
/* THE CONTAINER DECIDES, NOT THE CONTENT. min-height was not enough: a card
   with a four-line hint is taller than one with two, so the deck grew and shrank
   with whatever happened to be offered. The row is a fixed box and the cards
   fill it. */
#cards{display:flex;gap:8px;height:132px;--ct:1;--ht:1;--st:1}
/* HIS NOTE 22: at a wider offer the card text was cut off in silence.
   The row is fixed at 132px so the field never moves, and every line inside it
   has a fixed height too -- so when the market's wider offer puts a fourth card
   in the row, each card drops from 118px to 86px and the text does not shrink
   with it. Measured rather than guessed: the stat line wants 90px on one line
   and has 108px at three cards, 76px at four. It wrapped to a second line inside
   a box one line tall with overflow:hidden, so "840 hp - 44 dps" simply lost its
   damage. The trait line lost a line the same way.
   Widening cannot take the height back (the deck is a flex sibling of the
   battlefield), so the type scales instead, and it counts the row rather than
   being told: no state, nothing for a render to forget to set, and the same
   answer whatever put the fourth card there.
   The factors are the measured need with margin -- 76/90 = .84 at four,
   57/90 = .63 at five -- and five is not reachable today: RULES.offer is 3 and
   the market's wider offer adds one. It is here so the failure is graceful
   rather than silent if it ever is, and 5 costs type small enough that the card
   would want a different layout instead. */
/* The trait line gets its OWN factor because it is much the longest -- at four
   cards the shared one fixed the stat line and left this one still losing 5px,
   so one factor for both would have meant shrinking the numbers Sam asked for
   in order to fit the traits underneath them. */
/* AND THE STAT LINE IS GIVEN THE ROOM RATHER THAN SHRUNK TO FIT. Chasing it
   with the font alone took three passes and was still losing: its worst case is
   not the card with the biggest numbers, nor even the card with no attack, but
   an UPGRADE card, whose stat line reads "+35% hp & damage". Small enough to fit
   that at 67px is small enough to be unreadable, which loses the note it was
   fixing.
   So the two lines swap their boxes at a wider offer. The total is identical --
   22 + 12 before, 10 + 24 after -- so the card is the same height and the
   battlefield does not move. The stat line, which is the line Sam asked for,
   gets two lines and keeps everything; the trait line gets one and truncates
   with an ellipsis, which is a VISIBLE truncation rather than a silent one. The
   full traits are on the inspect screen either way.
   THE ELLIPSIS IS THE POINT: a line the reader can see is cut is not the defect
   class. A line that vanishes without a mark is. */
#cards:has(.card:nth-child(4)){--ct:.82;--ht:.82;--st:.82}
#cards:has(.card:nth-child(5)){--ct:.62;--ht:.62;--st:.62}
/* `width:100%` is load-bearing, not tidiness. The card is a centred flex column,
   so a child sizes to its content -- and a nowrap line sizes to the whole
   untruncated string, which made the CARD 37px wider than its own box and moved
   the silent clip up one element instead of removing it. Bounded to the card,
   the ellipsis happens inside the line where it can be seen. */
#cards:has(.card:nth-child(4)) .card .hint,
#cards:has(.card:nth-child(5)) .card .hint{
  height:10px;white-space:nowrap;text-overflow:ellipsis;width:100%}
#cards:has(.card:nth-child(4)) .card .stat,
#cards:has(.card:nth-child(5)) .card .stat{height:24px}
.card{flex:1 1 0;min-width:0;height:100%;overflow:hidden;border:0;border-radius:12px;
  background:var(--card);color:var(--cardInk);
  box-shadow:inset 0 -13px 0 var(--cardIn);padding:7px 5px 15px;text-align:center;font:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card:active{transform:translateY(1px)}
.card.up{background:var(--up);box-shadow:inset 0 -13px 0 var(--upIn)}
.card b{font-size:calc(11.5px * var(--ct));line-height:1.05;height:24px;display:flex;align-items:center;overflow:hidden}
.card .cls{display:none}
.card .hint{font-size:calc(9px * var(--ht));opacity:.7;line-height:1.2;height:22px;overflow:hidden}
/* His note 13: what the card IS, in one line. Slightly stronger than the trait
   hint because it is the comparison a player makes between three cards. */
.card .stat{font-size:calc(9.5px * var(--st));opacity:.9;font-weight:600;line-height:1.2;height:12px;overflow:hidden;font-variant-numeric:tabular-nums}
/* His note 12: how many you already hold. Quiet -- it is context for the pick,
   not the pick. */
.card .held{font-size:calc(8.5px * var(--ct));opacity:.55;line-height:1.15;height:10px;overflow:hidden}
/* The drawing, at 40pt on a 117pt card — sixteen times the area of the counter
   it stands for, and the only place a unit can carry any detail at all. */
.card .art{display:block;line-height:0;position:relative}
.card .art svg{display:block}
.card .chev{position:absolute;right:-11px;top:-3px;font-size:11px;color:#2f7a3a}
#info .ill{float:right;margin:-2px -2px 0 8px;line-height:0}
/* The ground a match is fought on, stated before the draft. Green because that
   is the band's colour on the field, so the sentence and the shape a player
   sees are obviously the same thing.
   ONE CLAUSE A LINE. Five grounds do two things now, and two clauses run
   together in one line is where a player stops reading. */
.ground{color:#7fd6a0;margin:6px 0}
.ground b{display:block;font-weight:600}
.ground .gl{display:block;opacity:.82;font-size:.92em}
.pick i .ground{display:block;margin:3px 0 0}
.gname{color:#7fd6a0}
/* THE LEDGER'S ROW. One button where three cards would be, so the deck keeps its
   132px and the battlefield does not move. It reads as a card rather than as a
   control because that is what it stands in for. */
/* Fixed height, like everything else down here. An EMPTY button is twenty-two
   pixels shorter than one with a word in it, and hiding it with visibility keeps
   its box but not its content -- so the deck still changed size between a pick
   and the fight, and the battlefield still moved. */
#act{display:flex;gap:8px;height:44px;margin-top:9px}
#go{flex:1 1 auto;min-width:0;height:100%;border:0;border-radius:11px;padding:0;font:inherit;
  font-weight:700;display:flex;align-items:center;justify-content:center;
  letter-spacing:1.2px;text-transform:uppercase;background:#2f5e7d;color:#eaf6ff}
/* His note 15. A battle is the only place it appears, because it is the only
   place it does anything -- and it is beside Skip because that is where the thumb
   already is. The row's height is the row's, so showing it moves nothing. */
#speed{flex:0 0 auto;display:flex;height:100%;border-radius:11px;overflow:hidden;background:#1b232e}
#speed.off{display:none}
#speed button{border:0;padding:0 11px;font:inherit;font-size:11px;font-weight:700;
  letter-spacing:.5px;background:transparent;color:var(--dim);font-variant-numeric:tabular-nums}
#speed button.on{background:#2f5e7d;color:#eaf6ff}
#go:active{background:#26506c}
#go.ghost{background:#1b232e;color:var(--dim)}
#go.off{visibility:hidden;pointer-events:none}

/* --------------------------------------------------------------- overlays */
.sheet{position:absolute;inset:0;background:var(--bg);z-index:9;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
/* A short sheet -- the result of a match, the pause -- sits in the middle of the
   screen. Top-aligned, three lines of text and a button hang off the top edge
   with eight hundred pixels of nothing under them. */
.sheet.centre{display:flex;flex-direction:column;justify-content:center}
.sheet.centre h1{margin-bottom:6px}
.sheet h1{font-size:21px;letter-spacing:2px;text-transform:uppercase;margin:6px 0 2px}
.sheet h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);
  margin:22px 0 8px;font-weight:600}
.sheet p{font-size:13px;color:#b8c6d6;margin:0 0 12px}
/* Where you are and whose it is -- Sam's note 18. The line from the book sits
   under it, marked like a unit's, because a map is quoted the same way a card is. */
.sheet p.where{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);margin:0 0 4px}
.sheet p.where b{color:var(--amber);font-weight:600}
.sheet q.mapq{display:block;font-size:12px;color:#93a3b5;line-height:1.45;margin:0 0 12px}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--edge);border-radius:12px;
  background:#131b25;color:var(--ink);padding:11px 13px;margin-bottom:8px;font:inherit}
.pick:active{background:#1a2431}
.pick b{display:block;font-size:14px;margin-bottom:2px}
.pick i{font-style:normal;font-size:12px;color:var(--dim);line-height:1.4}
.rosterRow{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #1a222c}
.rosterRow svg{flex:0 0 34px}
.rosterRow div{min-width:0}
.rosterRow b{font-size:13.5px}
.rosterRow em{font-style:normal;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.rosterRow q{display:block;font-size:11.5px;color:#93a3b5;margin-top:3px;quotes:'"' '"'}
.src{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:#5d6b7c;margin-top:2px;display:block}
.foot{font-size:10.5px;color:#4e5b6b;text-align:center;margin-top:26px;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div id="who">The Column</div>
    <div class="hearts r" id="livesB"></div>
  </div>
  <div id="fieldWrap">
    <svg id="field" viewBox="0 0 100 140" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="toast"></div>
    <div id="info"></div>
  </div>
  <div id="deck">
    <div id="head"><div id="prompt"></div>
      <div class="right"><span id="cash"></span><span class="hearts" id="livesA"></span></div></div>
    <div id="sub"></div>
    <div id="cards"></div>
    <!-- THE ACTION ROW. Fixed 44px whatever is in it: during a battle it holds the
         speed selector and a narrower Skip, everywhere else just the button. The
         deck is a flex sibling of the field, so this row changing height would
         move the battlefield -- note 4, which is why the row owns the height and
         its contents do not. -->
    <div id="act">
      <div id="speed" class="off"></div>
      <button id="go" class="off"></button>
    </div>
  </div>
</div>
<script type="module" src="./ui.js"></script>
</body>
</html>
