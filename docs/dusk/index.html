<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>A small world at dusk</title>
<style>
  :root {
    --sky-deep: #060716;
    --haze: #3a2040;
    --ink: #f3e6d8;
    --ink-soft: rgba(243, 230, 216, 0.62);
    --glow: #ffc880;
    box-sizing: border-box;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f3e6d8; }
  }
  :root[data-theme="dark"] { --ink: #f3e6d8; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sky-deep);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas#world {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    outline: none;
  }
  .hud {
    position: fixed; left: 0; right: 0;
    pointer-events: none;
    display: flex; justify-content: space-between; align-items: baseline;
    padding-left: calc(18px + env(safe-area-inset-left, 0px));
    padding-right: calc(18px + env(safe-area-inset-right, 0px));
    text-shadow: 0 1px 8px rgba(6, 7, 22, 0.9);
  }
  .hud-top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .hud-bottom {
    bottom: 0; justify-content: center;
    padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  }
  .place { font-size: 1.05rem; font-style: italic; letter-spacing: 0.01em; }
  .readout {
    font-size: 0.9rem; color: var(--ink-soft); text-align: right; line-height: 1.35;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    font-size: 1rem; color: var(--ink);
    transition: opacity 1.2s ease;
    text-align: center; max-width: 34ch; line-height: 1.4;
  }
  .hint.gone { opacity: 0; }
  .stick {
    position: fixed; width: 104px; height: 104px;
    margin: -52px 0 0 -52px;
    border: 1px solid rgba(243, 230, 216, 0.35);
    border-radius: 50%;
    pointer-events: none; display: none;
  }
  .stick i {
    position: absolute; left: 50%; top: 50%;
    width: 38px; height: 38px; margin: -19px 0 0 -19px;
    border-radius: 50%;
    background: rgba(255, 200, 128, 0.55);
  }
  .hull {
    position: fixed;
    top: calc(48px + env(safe-area-inset-top, 0px));
    left: calc(18px + env(safe-area-inset-left, 0px));
    width: min(48vw, 230px); height: 6px; border-radius: 3px;
    background: rgba(243, 230, 216, 0.2);
    overflow: hidden; display: none; pointer-events: none;
  }
  .hull i { display: block; height: 100%; width: 100%; background: var(--glow); transition: width 0.15s linear; }
  .hull i.low { background: #ff7058; }
  .shieldbar { top: calc(57px + env(safe-area-inset-top, 0px)); height: 4px; border-radius: 2px; }
  .shieldbar i { background: #8fe9ff; }
  .point {
    position: fixed; left: 0; top: 0;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    pointer-events: none; display: none;
  }
  .point i {
    position: absolute; inset: 0;
    background: var(--glow);
    clip-path: polygon(50% 0, 100% 100%, 50% 70%, 0 100%);
    filter: drop-shadow(0 0 4px rgba(6, 7, 22, 0.9));
  }
  .point.raid i { background: #ff5a48; }
  .point.lock i {
    inset: 2px; background: none; clip-path: none;
    border: 1.5px solid var(--glow);
    transform: rotate(45deg);
  }
  .point.raid.lock i { border-color: #ff5a48; }
  .warn {
    position: fixed;
    top: calc(68px + env(safe-area-inset-top, 0px));
    left: calc(18px + env(safe-area-inset-left, 0px));
    color: #ff7058; font-style: italic; font-size: 1.05rem;
    text-shadow: 0 1px 8px rgba(6, 7, 22, 0.9);
    display: none; pointer-events: none;
    animation: warnblink 0.5s steps(2, start) infinite;
  }
  @keyframes warnblink { to { visibility: hidden; } }
  .hurt {
    position: fixed; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255, 60, 50, 0) 42%, rgba(255, 60, 50, 0.6) 100%);
  }
  .note {
    position: fixed; left: 50%; top: 42%;
    transform: translate(-50%, -50%);
    width: min(80vw, 24ch); text-align: center;
    font-size: 1.3rem; line-height: 1.4;
    text-shadow: 0 1px 10px rgba(6, 7, 22, 0.95);
    display: none; pointer-events: none;
  }
  .pick {
    position: fixed; inset: 0; z-index: 5;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    background: rgba(6, 7, 22, 0.74);
  }
  .pick h2 {
    margin: 0 0 18px; max-width: 20ch;
    font-weight: normal; font-style: italic; font-size: 1.35rem; line-height: 1.3; text-align: center;
  }
  .cards { display: flex; flex-direction: column; gap: 12px; width: min(100%, 340px); }
  .card {
    all: unset; box-sizing: border-box; display: block; width: 100%;
    padding: 14px 16px; border-radius: 10px;
    border: 1px solid rgba(255, 200, 128, 0.55);
    background: rgba(58, 32, 64, 0.8);
    color: var(--ink); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { background: rgba(255, 200, 128, 0.24); }
  .card:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .card-name { display: block; font-size: 1.15rem; }
  .card-desc { display: block; margin-top: 3px; font-size: 0.95rem; line-height: 1.35; color: var(--ink-soft); }
  .card-lvl { display: block; margin-top: 6px; font-size: 0.85rem; font-style: italic; color: var(--glow); }
  .cross {
    position: fixed; left: 50%; top: 50%;
    width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border: 1.5px solid rgba(255, 200, 128, 0.8);
    border-radius: 50%;
    pointer-events: none; display: none;
  }
  .cross::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    border-radius: 50%; background: var(--glow);
  }
  .fire {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right, 0px));
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    width: 92px; height: 92px; border-radius: 50%;
    border: 1.5px solid rgba(255, 112, 88, 0.85);
    background: rgba(255, 112, 88, 0.16);
    color: var(--ink); font-size: 1.05rem; font-style: italic;
    display: none; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .fire.on { background: rgba(255, 112, 88, 0.5); }
  .snd {
    all: unset; position: fixed; z-index: 4;
    top: calc(64px + env(safe-area-inset-top, 0px));
    right: calc(18px + env(safe-area-inset-right, 0px));
    box-sizing: border-box; min-width: 34px; padding: 5px 10px; border-radius: 999px; text-align: center;
    border: 1px solid rgba(255, 200, 128, 0.55); background: rgba(6, 7, 22, 0.55);
    color: var(--glow); font-size: 0.9rem; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .snd.off { opacity: 0.5; text-decoration: line-through; }
  .snd:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  /* SAM: test panel, remove when building ends */
  .sam {
    all: unset; position: fixed; z-index: 4;
    top: calc(64px + env(safe-area-inset-top, 0px));
    right: calc(62px + env(safe-area-inset-right, 0px));
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid rgba(143, 233, 255, 0.6); background: rgba(6, 7, 22, 0.55);
    color: #8fe9ff; font-size: 0.9rem; font-style: italic; cursor: pointer;
    display: none; -webkit-tap-highlight-color: transparent;
  }
  .sam:active { background: rgba(143, 233, 255, 0.25); }
  .dev {
    position: fixed; inset: 0; z-index: 6;
    display: none; flex-direction: column; align-items: center;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px));
    background: rgba(6, 7, 22, 0.86); overflow-y: auto;
  }
  .dev h2 { margin: 4px 0 12px; font-weight: normal; font-style: italic; font-size: 1.2rem; color: #8fe9ff; }
  .dev-list { width: min(100%, 360px); display: flex; flex-direction: column; gap: 6px; }
  .dev-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; background: rgba(58, 32, 64, 0.7);
  }
  .dev-name { flex: 1; font-size: 1rem; }
  .dev-lvl { width: 3ch; text-align: center; color: var(--glow); font-variant-numeric: tabular-nums; }
  .dev-btn {
    all: unset; box-sizing: border-box; width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 200, 128, 0.55); color: var(--ink); font-size: 1.2rem; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dev-btn:active { background: rgba(255, 200, 128, 0.25); }
  .dev-btn[disabled] { opacity: 0.25; }
  .dev-diag { width: min(100%, 360px); margin: -4px 0 10px; font: 0.8rem/1.4 ui-monospace, Menlo, monospace; color: #8fe9ff; word-break: break-word; }
  .dev-snd { width: min(100%, 360px); display: flex; flex-wrap: wrap; gap: 6px; }
  .dev-snd .dev-btn { width: auto; height: 34px; padding: 0 10px; font-size: 0.9rem; }
  .dev-foot { display: flex; gap: 10px; margin-top: 14px; width: min(100%, 360px); }
  .dev-foot .dev-btn { flex: 1; width: auto; font-size: 1rem; font-style: italic; }
  .fail {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    padding: 2rem; text-align: center; line-height: 1.5;
  }
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="A 3D landscape you can fly through"></canvas>

<div class="hud hud-top">
  <span class="place">A small world at dusk</span>
  <span class="readout" id="readout"></span>
</div>
<div class="hud hud-bottom">
  <span class="hint" id="hint"></span>
</div>
<div class="stick" id="stick"><i id="knob"></i></div>
<div class="hull" id="hull" role="img" aria-label="Hull strength"><i id="hullFill"></i></div>
<div class="hull shieldbar" id="shieldBar" role="img" aria-label="Shield strength"><i id="shieldFill"></i></div>
<div class="point" id="point"><i></i></div>
<div class="warn" id="warn">Missile</div>
<div class="hurt" id="hurt"></div>
<div class="note" id="note"></div>
<div class="pick" id="pick"><h2 id="pickTitle"></h2><div class="cards" id="pickCards"></div></div>
<div class="cross" id="cross"></div>
<div class="fire" id="fire">Fire</div>
<button type="button" class="snd" id="snd" aria-label="Sound and music on">♪</button>
<!-- SAM: test panel, remove when building ends -->
<button type="button" class="sam" id="sam">Sam</button>
<div class="dev" id="dev"><h2>Upgrades</h2><div class="dev-list" id="devList"></div>
  <h2>Sounds</h2><div class="dev-diag" id="devDiag"></div><div class="dev-snd" id="devSnd"></div>
  <div class="dev-foot"><button type="button" class="dev-btn" id="devWalker">Boss: walker</button><button type="button" class="dev-btn" id="devWall">Boss: ice wall</button><button type="button" class="dev-btn" id="devBoss">Boss: dreadnought</button><button type="button" class="dev-btn" id="devTime">Time: dusk</button><button type="button" class="dev-btn" id="devWx">Weather: clear</button><button type="button" class="dev-btn" id="devRaid">Send interceptors</button><button type="button" class="dev-btn" id="devClear">Clear round</button><button type="button" class="dev-btn" id="devClose">Close</button></div></div>
<!-- /SAM -->
<div class="fail" id="fail">This device couldn’t start 3D graphics. Try opening the page in Safari or Chrome.</div>

<script src="./three.min.js"></script>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('world');
  var hintEl = document.getElementById('hint');
  var readoutEl = document.getElementById('readout');
  var stickEl = document.getElementById('stick');
  var knobEl = document.getElementById('knob');

  var renderer;
  try {
    if (!window.THREE) throw new Error('no three');
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    document.getElementById('fail').style.display = 'flex';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  hintEl.textContent = isTouch
    ? 'Touch to take the ship. Left thumb is throttle, right thumb steers, hold Fire to shoot.'
    : 'Click to take the ship. Drag to steer, W and S for throttle, space to shoot.';

  // ---------- terrain maths ----------
  var SIZE = 520, SEG = 220, HALF = SIZE / 2;
  // THE ARENA'S SCALE. Sam: each chapter's arena "new and larger" as the enemy numbers grow. MINE: big enough to keep
  // the spacing round 4 has, by the last ordinary round of the chapter, and no bigger from chapter 4 on. Round n has 11n
  // enemies, so the area goes with (5c + 4) / 4 and the width with its root: 1, 1.5, 1.87, 2.18. The ground keeps its
  // detail (one point every 2.36), so it has more points, not coarser ones. What scales with it: the ground and its edge,
  // where things spawn, the capital ships' circles, the crags at the rim, the far ridges, the volcano, the far fight and
  // the weather's veil. What does not: the bosses and everything tuned round them, which stand in the middle.
  var SCALE = 1, scaleHold = null; // scaleHold: one size for every chapter, for the suites
  function scaleOf(c) { return Math.sqrt((5 * Math.min(c, 3) + 4) / 4); }
  var EDGE = 222, SPAWN = 205; // where the ship turns itself for home, and how far out things are put, at scale 1
  var PAD_H = 6;

  function hash(x, z) {
    var n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function vnoise(x, z) {
    var xi = Math.floor(x), zi = Math.floor(z);
    var xf = x - xi, zf = z - zi;
    var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    var a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, z) {
    var s = 0, amp = 0.5, f = 1;
    for (var i = 0; i < 5; i++) { s += amp * vnoise(x * f, z * f); f *= 2.03; amp *= 0.5; }
    return s / 0.96875;
  }
  function smooth(a, b, t) {
    t = Math.min(1, Math.max(0, (t - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }
  // ---------- arenas: the same map, a different landscape ----------
  // Everything in the game that stands on the ground asks height(x, z) where the ground is, so a second landscape is
  // a second function behind that one name, plus the mesh rebuilt from it and the light re-coloured. 0 is the dusk
  // world. 1 is the ice field, with the wall across its middle that Sam's second boss will be fought on.
  var arena = 0, arenaHold = false; // arenaHold: leave the landscape alone when a round starts. For looking at one, and for the suites.
  var WALL_LEN = 130, WALL_TOP = 95, WALL_LEDGES = [[62, 11, 26], [32, 29, 44]]; // each ledge: its height, and where it runs from and to, out from the crest
  // The wall falls in four sections, each 50 along x (the outer two take the tapering ends with them).
  // wallDown[k] runs 0 (standing) to 1 (rubble); the ground is whatever this says it is, so a section really sinks.
  var WALL_SECS = 4, WALL_SEC = 50, wallDown = [0, 0, 0, 0];
  function wallSecOf(x) { return Math.max(0, Math.min(WALL_SECS - 1, Math.floor((x + WALL_SECS * WALL_SEC / 2) / WALL_SEC))); }
  function wallDownAt(x) {
    var u = (x + WALL_SECS * WALL_SEC / 2) / WALL_SEC, k = wallSecOf(x), d = wallDown[k], fr = u - Math.floor(u);
    // a few metres of slope between a standing section and a fallen one, so the mesh is not asked for a sheer step
    if (u > 0 && u < WALL_SECS) {
      if (fr < 0.06 && k > 0) d = wallDown[k - 1] + (d - wallDown[k - 1]) * (0.5 + fr / 0.12);
      else if (fr > 0.94 && k < WALL_SECS - 1) d = d + (wallDown[k + 1] - d) * ((fr - 0.94) / 0.12);
    }
    return d;
  }
  // THE ICE FIELD'S TERRITORIES (chapter step 3, second version). Sam, of the first: "it also looks like little demo
  // areas around the map on the snow one" -- four stamped shapes on a plain that was still plain everywhere else. Now
  // the plain round the wall is divided into four territories, each about a quarter of it, whose borders wander and
  // blend into each other, and each fades in from the wall's clear ring and out into the crags at the rim:
  //   crevasse country (towards 225 degrees) -- a broken shelf 34 high, a network of canyons 22 wide through it
  //   the lake basin (315) -- a wide frozen lake, a ragged shore, a few low islands; the drones gather over it
  //   the spire forest (135) -- columns dense and tall in its heart, thinning out towards its edges
  //   pressure ridges (45) -- long parallel ridges of ice, valleys between them to fly along
  // And bases scattered through them (Sam: "can have a large one or a few but mostly smaller scattered around"): one
  // large, off the wall's end, and three small camps at chapter 2's size, five at full size, each walled, a gate facing
  // the middle. Every guard tower of the wall keeps a patch of plain to stand on. At today's size there is no room
  // between the wall and the crags, and the ice is as it always was.
  var ICE_T = null, ICE_T_AT = -1, ICE_SHELF = 34, ICE_LAKE_H = 1.2, ICE_CANYON = 22, ICE_CANYON_GAP = 70, ICE_SPIRE_GAP = 26;
  var ICE_TERR = [{ k: 'crev', a: 225 }, { k: 'lake', a: 315 }, { k: 'spires', a: 135 }, { k: 'ridges', a: 45 }];
  function angDiff(a, b) { var d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
  // how much of each territory is here, 0 to 1 each, together no more than 1
  function iceWeights(x, z, out) {
    var L = ICE_T, d = Math.sqrt(x * x + z * z), i;
    for (i = 0; i < 4; i++) out[i] = 0;
    // in from the wall itself, not from a ring round the middle: a first version began at 150 from the middle all the
    // way round, and from above the territories were a ring round a plain. Now they come to about 55 from the wall's
    // faces and ends, leaving it a moat to be fought across
    var wx = Math.max(0, Math.abs(x) - 135), wz = Math.max(0, Math.abs(z) - 50), dw = Math.sqrt(wx * wx + wz * wz);
    var rad = smooth(35, 75, dw) * (1 - smooth(L.outer - 45, L.outer, d));
    for (i = 0; i < WALL_TOWERS.length; i++) { var tx = x - WALL_TOWERS[i][0], tz = z - WALL_TOWERS[i][1]; rad *= smooth(16, 30, Math.sqrt(tx * tx + tz * tz)); }
    if (rad <= 0) return 0;
    var th = Math.atan2(z, x) + (fbm(x * 0.006 + 3.3, z * 0.006 + 8.1) - 0.5) * 1.6, sum = 0; // borders that wander
    for (i = 0; i < 4; i++) { out[i] = 1 - smooth(0.35, 1.25, Math.abs(angDiff(th, ICE_TERR[i].a * Math.PI / 180))); sum += out[i]; } // a wide band where two meet: a first version blended 8% of the land
    for (i = 0; i < 4; i++) out[i] = sum > 0 ? out[i] / sum * rad : 0;
    return rad;
  }
  function iceLayout() {
    if (ICE_T_AT === SCALE) return ICE_T;
    ICE_T_AT = SCALE;
    var outer = 170 * SCALE;
    if (outer - 140 < 70) return (ICE_T = null);
    var L = ICE_T = { outer: outer, rc: (110 + outer) / 2, bases: [], spires: {} }, w = [0, 0, 0, 0];
    L.lake = { x: Math.cos(315 * Math.PI / 180) * L.rc, z: Math.sin(315 * Math.PI / 180) * L.rc, R: (outer - 150) * 0.45 };
    // the spires, worked out once for this size: a jittered grid over the map, each kept with the forest's weight there
    for (var gx = -outer; gx <= outer; gx += ICE_SPIRE_GAP) for (var gz = -outer; gz <= outer; gz += ICE_SPIRE_GAP) {
      var sx = gx + (hash(gx * 0.31 + 5, gz * 0.17) - 0.5) * 5, sz = gz + (hash(gx * 0.13, gz * 0.29 + 7) - 0.5) * 5;
      iceWeights(sx, sz, w);
      var dens = smooth(0.15, 0.6, w[2]);
      if (dens <= 0 || hash(sx * 0.7 + 1, sz * 0.7 + 2) > dens) continue;
      var key = Math.round(gx / ICE_SPIRE_GAP) + ',' + Math.round(gz / ICE_SPIRE_GAP);
      L.spires[key] = { x: sx, z: sz, r: 3 + hash(sx, sz) * 1.5, h: (20 + hash(sz * 0.7, sx * 0.9) * 40) * (0.5 + 0.5 * smooth(0.3, 0.8, w[2])) };
    }
    // the bases: one large off the wall's end, small camps scattered through the territories, each kept clear of the
    // wall's towers and of each other
    function base(deg, rr, half, guns) {
      var a = deg * Math.PI / 180, b = { x: Math.cos(a) * rr, z: Math.sin(a) * rr, half: half, wallT: half > 20 ? 5 : 3, wallH: half > 20 ? 16 : 11, gate: half > 20 ? 9 : 7, guns: guns };
      var ext = half + b.wallT + 8;
      for (var i = 0; i < WALL_TOWERS.length; i++) if (Math.hypot(WALL_TOWERS[i][0] - b.x, WALL_TOWERS[i][1] - b.z) < ext + 24) return;
      for (i = 0; i < L.bases.length; i++) if (Math.hypot(L.bases[i].x - b.x, L.bases[i].z - b.z) < ext + L.bases[i].half + 30) return;
      if (rr + ext > outer - 10) return;
      b.gx = -b.x / rr; b.gz = -b.z / rr; L.bases.push(b);
    }

    var b = document.createElement('button'); b.type = 'button'; b.className = 'dev-btn'; b.textContent = SFX[k].label;
    b.addEventListener('click', function () { devPlay(function () { sfxLast[k] = -9; sfx(k); }); });
    document.getElementById('devSnd').appendChild(b);
  });
  samEl.addEventListener('click', function () { devShow(true); });
  document.getElementById('devClose').addEventListener('click', function () { devShow(false); });
  document.getElementById('devClear').addEventListener('click', function () {
    var i;
    for (i = 0; i < drones.length; i++) { drones[i].alive = false; drones[i].mesh.visible = false; }
    for (i = 0; i < ground.length; i++) { ground[i].alive = false; ground[i].group.visible = false; ground[i].ring.visible = false; }
    for (i = 0; i < fleet.length; i++) if (fleet[i].gone <= 0) { fleet[i].gone = Infinity; fleet[i].dying = 0; fleet[i].ship.visible = false; }
    devShow(false);
    updateReadout(); checkRound();
  });
  // straight to the next round that is a multiple of five, with the boss named, so each can be tried at each tier
  document.getElementById('devWalker').addEventListener('click', function () { devShow(false); bossForce = 'walker'; startRound(Math.floor(round / 5) * 5 + 5); roundBanner(); });
  document.getElementById('devWall').addEventListener('click', function () { devShow(false); bossForce = 'wall'; startRound(Math.floor(round / 5) * 5 + 5); roundBanner(); });
  document.getElementById('devBoss').addEventListener('click', function () { devShow(false); bossForce = 'dread'; startRound(Math.floor(round / 5) * 5 + 5); roundBanner(); });
  // the next time of day, now, in the dusk world: so each can be judged without playing four rounds. The round after
  // carries on the cycle from its own number, as ever.
  var devTimeEl = document.getElementById('devTime');
  document.getElementById('devTime').addEventListener('click', function () {
    tod = (tod + 1) % TIMES.length; applyLook(); devTimeEl.textContent = 'Time: ' + TIMES[tod].name;
  });
  // the next weather, now, in this round: so each can be judged without waiting for it to come up
  var devWxEl = document.getElementById('devWx'), WX_KEYS = Object.keys(WX);
  document.getElementById('devWx').addEventListener('click', function () {
    wxForce = WX_KEYS[(WX_KEYS.indexOf(wx) + 1) % WX_KEYS.length]; wxStart(round); devWxEl.textContent = 'Weather: ' + (wxName() || 'clear');
  });
  document.getElementById('devRaid').addEventListener('click', function () {
    // two of them, now, whatever the round: so the flying can be judged without playing to round 3
    for (var i = 0; i < ics.length; i++) icHide(ics[i]);
    icWant = 2; icPeelT = 0.05; devShow(false);
  });
  // ---------- /SAM ----------

  startRound(1);

  // ---------- loop ----------
  var last = performance.now(), time = 0;
  var orbit = 0.9;
  camera.position.set(70, 30, 70);

  function tick(now) {
    // the upgrade screen freezes the fight
    if (picking || devOpen) { last = now; audioFrame(false); renderer.render(scene, camera); requestAnimationFrame(tick); return; }
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now; time += dt;

    placeFleet(dt);
    updateCapitals(dt);
    updateDrones(dt);
    updateGround(dt);
    updateWall(dt);
    updateWalker(dt);
    updateLavaBombs(dt);
    updateMissiles(dt);
    updateRounds(dt);

    if (!inControl) {
      // slow establishing orbit until the first touch
      orbit += dt * 0.07;
      var ox = Math.cos(orbit) * 82, oz = Math.sin(orbit) * 82;
      var oy = Math.max(height(ox, oz), 0) + 20 + Math.sin(orbit * 1.7) * 4;
      camera.position.set(ox, oy, oz);
      camera.lookAt(0, PAD_H + 20, 0);
    } else if (dead) {
      deadT += dt;
      camera.position.y += dt * 2;
    } else {
      sinceHit += dt;
      if (sinceHit > 4 - up.repair && hull < maxHull()) { hull = Math.min(maxHull(), hull + (5 + 4 * up.repair) * dt); showHull(); }
      var f = Math.max(-1, Math.min(1, (keys.f ? 1 : 0) - (keys.b ? 1 : 0) - joy.y));
      var s = Math.max(-1, Math.min(1, (keys.r ? 1 : 0) - (keys.l ? 1 : 0) + joy.x));
      var yawBefore = yaw;

      // near the edge of the map the ship turns itself for home
      var dc = Math.sqrt(shipPos.x * shipPos.x + shipPos.z * shipPos.z);
      if (dc > EDGE * SCALE) {
        var home = Math.atan2(shipPos.x, shipPos.z);
        var diff = Math.atan2(Math.sin(home - yaw), Math.cos(home - yaw));
        yaw += diff * Math.min(1, dt * 1.8);
      }

      speed += ((25 + f * 22) - speed) * (1 - Math.exp(-dt * 2.2));
      basis();
      shipPos.addScaledVector(fwdV, speed * dt).addScaledVector(rightV, s * 15 * dt);
      // the storm's wind; never further out past the edge, where the ship is already turning itself home
      if (wind.x || wind.z) { var wo = (shipPos.x * wind.x + shipPos.z * wind.z) / Math.max(1, dc); if (dc < EDGE * SCALE || wo < 0) shipPos.addScaledVector(wind, dt); }

      var ground = Math.max(height(shipPos.x, shipPos.z), 0) + 1.7;
      if (shipPos.y < ground) { shipPos.y = ground; if (pitch < 0.08) pitch = Math.min(0.08, pitch + dt * 2.4); }
      if (shipPos.y > 170) { shipPos.y = 170; if (pitch > 0) pitch = Math.max(0, pitch - dt * 2.4); }

      var yawRate = (yaw - yawBefore) / Math.max(dt, 0.001);
      // look input lands between frames, so measure the turn from the camera too
      var turn = Math.atan2(Math.sin(yaw - camera.rotation.y), Math.cos(yaw - camera.rotation.y)) / Math.max(dt, 0.001);
      var wantBank = Math.max(-0.95, Math.min(0.95, (turn + yawRate) * 0.28 - s * 0.45));
      bank += (wantBank - bank) * (1 - Math.exp(-dt * 6));

      player.position.copy(shipPos);
      player.rotation.set(pitch, yaw, bank);

      tmp.copy(shipPos).addScaledVector(fwdV, -9.5).addScaledVector(upV, 2.6);
      camera.position.lerp(tmp, 1 - Math.exp(-dt * 11));
      var cg = Math.max(height(camera.position.x, camera.position.z), 0) + 0.9;
      if (camera.position.y < cg) camera.position.y = cg;
      camera.rotation.set(pitch, yaw, 0);

      var glow = 0.7 + (speed / 47) * 1.3 + Math.sin(time * 40) * 0.08;
      playerEngines[0].scale.set(1, 1, glow * 1.1); playerEngines[1].scale.set(1, 1, glow * 1.1);

      cool -= dt;
      if ((fireTouch !== null || keys.fire) && cool <= 0) { shoot(); cool = 0.1 / (1 + 0.3 * up.rapid); }
      updateSeekerLaunch(dt);
      updateShield(dt);
    }
    updatePointDefence(dt);
    updateWingmen(dt);

    updateBolts(dt);
    updateSeekers(dt);
    updateShots(dt);
    updateChain(dt);
    updateBursts(dt);
    updateFar(dt);
    updateWeather(dt);
    updateDogfight(dt);
    updateBoss(dt);
    updateInterceptors(dt);

    sky.position.copy(camera.position);
    giant.rotation.y += dt * 0.01;

    for (var i = 0; i < blinkers.length; i++) {
      var bl = blinkers[i];
      bl.mesh.visible = Math.sin(time * bl.rate + bl.phase) > 0.35;
    }

    var flag = fleet[0].ship.position;
    for (var j = 0; j < shuttles.length; j++) {
      var u = (time * 0.045 + j / shuttles.length) % 1;
      var back = j % 2 === 1;
      var q = back ? 1 - u : u;
      tmp.copy(spireTop).lerp(flag, q);
      tmp.y += Math.sin(q * Math.PI) * 14 + (back ? -3 : 3);
      shuttles[j].position.copy(tmp);
      shuttles[j].visible = fleet[0].gone <= 0 && fleet[0].dying === 0;
    }

    updatePointer();
    updateIcMarkers();
    audioFrame(inControl && !dead);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
